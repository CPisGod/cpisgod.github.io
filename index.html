      note.style.color = "#888";
      note.textContent = "문서 파일(PDF 등)은 Storage에 있어 백업에 포함되지 않고, 목록과 주석 정보만 담깁니다.";
      const active = panels.findIndex(p => p && p.memoId);
      stack.append(
        modalButton("현재 메모 → .md 내려받기", () => exportMemo(active, "md")),
        modalButton("현재 메모 → .txt 내려받기", () => exportMemo(active, "txt")),
        modalButton("전체 메모 → ZIP (메모마다 .md 파일)", async () => {
          await loadScript(CDN + "jszip/3.10.1/jszip.min.js");
          const zip = new JSZip(), used = new Set();
          Object.entries(memos).forEach(([id, m]) => {
            let name = safeName(m.title), n = 2;
            while (used.has(name)) name = `${safeName(m.title)} (${n++})`;
            used.add(name);
            zip.file(name + ".md", memoToMarkdown(m));
          });
          downloadBlob(`memos-${new Date().toISOString().slice(0, 10)}.zip`, await zip.generateAsync({ type: "blob" }));
        }),
        modalButton("전체 백업 → JSON (메모, 휴지통, 문서 목록, 주석)", async () => {
          const b = await buildBackup();
          downloadBlob(`memos-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(b, null, 1), "application/json");
        }),
        modalButton("백업 JSON 불러오기 (복원)", () => {
          const inp = document.createElement("input");
          inp.type = "file"; inp.accept = ".json,application/json";
          inp.addEventListener("change", () => inp.files[0] && restoreBackup(inp.files[0]));
          inp.click();
        }),
        note
      );
      if (active < 0) { stack.children[0].disabled = stack.children[1].disabled = true; }
      body.appendChild(stack);
    });
  }
  document.getElementById("backup-btn").addEventListener("click", openBackupModal);

  // ── 주석 모음: 모든 문서의 하이라이트/메모를 한곳에서 보고, 마크다운으로 복사/저장 ──
  const COLOR_EMOJI = { y: "🟡", g: "🟢", b: "🔵", p: "🩷" };
  async function openAnnsModal() {
    let all = {};
    try { all = (await get(ref(db, "annotations"))).val() || {}; }
    catch (e) { statusEl.textContent = "❌ " + e.message; return; }
    const entries = [];
    for (const [docId, list] of Object.entries(all)) {
      if (!docs[docId]) continue;
      for (const [id, a] of Object.entries(list)) entries.push({ docId, id, ...a });
    }
    const pos = (a) => a.type === "rect" ? 1e9 + (a.page || 0) : (a.page || 0) * 1e6 + (a.start || 0);
    entries.sort((x, y) => docs[x.docId].name.localeCompare(docs[y.docId].name, "ko") || pos(x) - pos(y));
    const label = (a) => a.type === "rect" ? `▭ ${a.page}쪽 영역` : `${a.page ? `p.${a.page} ` : ""}“${a.quote}”`;
    let onlyNotes = false;
    const visible = () => entries.filter(a => !onlyNotes || a.note);
    const toMarkdown = () => {
      const lines = [`# 주석 모음 (${new Date().toLocaleDateString()})`];
      let cur = null;
      for (const a of visible()) {
        if (a.docId !== cur) { cur = a.docId; lines.push("", `## ${docs[cur].name}`, ""); }
        lines.push(`- ${COLOR_EMOJI[a.color] || "🟡"} ${a.type === "rect" ? label(a) : (a.page ? `(p.${a.page}) ` : "") + `"${a.quote.replace(/\s+/g, " ")}"`}${a.note ? ` — ${a.note.replace(/\n+/g, " ")}` : ""}`);
      }
      return lines.join("\n") + "\n";
    };
    openModal("💬 주석 모음", (body, foot) => {
      const render = () => {
        body.innerHTML = "";
        const bar = document.createElement("label");
        bar.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:6px;cursor:pointer";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = onlyNotes;
        cb.addEventListener("change", () => { onlyNotes = cb.checked; render(); });
        bar.append(cb, "메모가 있는 것만 보기");
        body.appendChild(bar);
        const list = visible();
        if (!list.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = entries.length ? "조건에 맞는 주석이 없습니다." : "아직 하이라이트나 메모가 없습니다."; body.appendChild(e); return; }
        let cur = null;
        for (const a of list) {
          if (a.docId !== cur) { cur = a.docId; const h = document.createElement("div"); h.className = "sec"; h.textContent = "📄 " + docs[cur].name; body.appendChild(h); }
          const row = document.createElement("div");
          row.className = "ann-row";
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.style.background = ANN_COLORS[a.color] || ANN_COLORS.y;
          const t = document.createElement("div");
          const q = document.createElement("div");
          q.className = "q";
          q.textContent = trunc(label(a), 140);
          t.appendChild(q);
          if (a.note) { const n = document.createElement("div"); n.className = "n"; n.textContent = a.note; t.appendChild(n); }
          row.append(dot, t);
          row.addEventListener("click", () => { closeModal(); openDocInRight(a.docId, { ann: a.id }); });
          body.appendChild(row);
        }
      };
      render();
      foot.hidden = false;
      foot.append(
        modalButton("📋 마크다운 복사", async () => {
          try { await navigator.clipboard.writeText(toMarkdown()); statusEl.textContent = "📋 주석 모음을 복사했습니다."; } catch (e) { statusEl.textContent = "❌ 복사 실패: " + e.message; }
        }),
        modalButton("📝 새 메모로 저장", () => {
          const r = push(memosRef), now = Date.now();
          set(r, { title: `주석 모음 ${new Date().toLocaleDateString()}`, content: toMarkdown(), created: now, ts: now })
            .then(() => { closeModal(); loadMemoInPanel(0, r.key); });
        }),
        modalButton("⬇ .md", () => downloadBlob(`주석 모음 ${new Date().toISOString().slice(0, 10)}.md`, toMarkdown(), "text/plain;charset=utf-8"))
      );
    });
  }
  document.getElementById("anns-btn").addEventListener("click", openAnnsModal);

  // ── 1분마다 자동저장 (변경된 패널만) ──
  setInterval(() => {
    panels.forEach((p, i) => {
      if (p && p.memoId && p.dirty) savePanel(i, true);
    });
  }, 60000);

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      panels.forEach((p, i) => {
        if (p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl))
          savePanel(i);
      });
      const anyFocused = panels.some(p => p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl));
      if (!anyFocused && panels[0] && panels[0].memoId) savePanel(0);
    }

    // Ctrl(Cmd) + K: 전체 검색
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (window.innerWidth <= 768) sidebarEl.classList.remove("collapsed");
      searchInput.focus();
      searchInput.select();
    }

    // Ctrl(Cmd) + F: 열려 있는 문서 안에서 검색 (문서가 없으면 브라우저 기본 검색)
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "f") {
      const dp = activeDocPanel();
      if (dp && textRootOf(dp)) { e.preventDefault(); openFind(dp); }
    }

    // Ctrl(Cmd) + Alt + C: 포커스된 에디터 글꼴 Consolas 전환/해제
    if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === "c") {
      e.preventDefault();
      let target = panels.find(p => p && document.activeElement === p.editorEl);
      if (!target) target = panels[0];
      if (target && target.editorEl) target.editorEl.classList.toggle("font-consolas");
    }
  });

  // ── 드래그 선택된 글자수 표시 ──
  function updateSelectionCounts() {
    const sel = (window.getSelection && window.getSelection()) || null;
    panels.forEach((p) => {
      if (!p || !p.selCountEl) return;
      let len = 0;
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const range = sel.getRangeAt(0);
        if (p.editorEl.contains(range.commonAncestorContainer)) {
          len = sel.toString().length;
        }
      }
      p.selCountEl.textContent = len > 0 ? `선택 ${len}자 · ` : "";
    });
  }
  document.addEventListener("selectionchange", updateSelectionCounts);

  function setSplit(on) {
    splitOn = on;
    splitToggle.textContent = splitOn ? "⊞ 분할화면 ON" : "⊟ 분할화면";
    splitToggle.classList.toggle("on", splitOn);
    rebuildPanels();
    saveDocState();
  }
  splitToggle.addEventListener("click", () => setSplit(!splitOn));

  function rebuildPanels() {
    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    const doc0 = panels[0] ? panels[0].docId : null;
    const doc1 = panels[1] ? panels[1].docId : null;
    panels = [];
    panelsEl.innerHTML = "";

    const p0El = createPanelEl(0);
    panelsEl.appendChild(p0El);

    if (splitOn) {
      const div = document.createElement("div");
      div.className = "divider";
      panelsEl.appendChild(div);

      const p1El = createPanelEl(1);
      panelsEl.appendChild(p1El);

      let dragging = false;
      div.addEventListener("mousedown", (e) => { dragging = true; div.classList.add("dragging"); e.preventDefault(); });
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const rect = panelsEl.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.min(Math.max(pct, 20), 80);
        p0El.style.flex = "none";
        p0El.style.width = pct + "%";
        p1El.style.flex = "1";
      });
      document.addEventListener("mouseup", () => { dragging = false; div.classList.remove("dragging"); });

      if (id1) loadMemoInPanel(1, id1);
    }

    if (id0) loadMemoInPanel(0, id0);
    if (doc0) openDoc(0, doc0);
    if (splitOn && doc1) openDoc(1, doc1);
    renderList();
  }

  function sidebarClickMemo(memoId) {
    if (!splitOn) {
      loadMemoInPanel(0, memoId);
    } else if (panels[1] && panels[1].docId) {
      loadMemoInPanel(0, memoId);  // 오른쪽은 문서 뷰어 → 메모는 왼쪽에
    } else {
      if (panels[0] && panels[0].memoId === memoId) loadMemoInPanel(1, memoId);
      else loadMemoInPanel(0, memoId);
    }
  }

  // ── 전체 검색: 메모(제목/본문/폴더/태그) + 문서 이름 + 색인된 문서 본문 ──
  const searchInput = document.getElementById("search-input");
  let searchQuery = "";
  let searchSeq = 0;
  let docTextCache = null;
  async function ensureDocText() {
    if (docTextCache) return docTextCache;
    try { docTextCache = (await get(ref(db, "docText"))).val() || {}; } catch (e) { docTextCache = {}; }
    return docTextCache;
  }
  // 일치 부분을 강조한 요약문 (앞뒤 문맥 포함)
  function snippetEl(text, q) {
    const flat = text.replace(/\s+/g, " ");
    const i = flat.toLowerCase().indexOf(q.toLowerCase());
    const el = document.createElement("div");
    el.className = "s-snip";
    if (i < 0) { el.textContent = trunc(flat, 90); return el; }
    const a = Math.max(0, i - 30), b = Math.min(flat.length, i + q.length + 60);
    el.append((a > 0 ? "…" : "") + flat.slice(a, i));
    const bold = document.createElement("b");
    bold.textContent = flat.slice(i, i + q.length);
    el.append(bold, flat.slice(i + q.length, b) + (b < flat.length ? "…" : ""));
    return el;
  }
  function focusMemoMatch(panelIdx, q) {
    const p = panels[panelIdx];
    if (!p) return;
    const lq = q.toLowerCase();
    const w = document.createTreeWalker(p.editorEl, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) {
      const i = w.currentNode.nodeValue.toLowerCase().indexOf(lq);
      if (i < 0) continue;
      const r = document.createRange();
      r.setStart(w.currentNode, i);
      r.setEnd(w.currentNode, i + q.length);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      w.currentNode.parentElement.scrollIntoView({ block: "center" });
      return;
    }
  }
  async function renderSearchResults() {
    const q = searchQuery, lq = q.toLowerCase(), seq = ++searchSeq;
    const has = (t) => (t || "").toLowerCase().includes(lq);
    const group = (label) => { const g = document.createElement("div"); g.className = "search-group"; g.textContent = label; return g; };
    const item = (title) => {
      const it = document.createElement("div");
      it.className = "search-item";
      const t = document.createElement("div");
      t.className = "s-title";
      t.textContent = title;
      it.appendChild(t);
      return it;
    };

    // 메모
    const memoHits = Object.keys(memos)
      .filter(id => { const m = memos[id]; return has(m.title) || has(m.content) || has(m.folder) || (m.tags || []).some(has); })
      .sort((a, b) => (has(memos[b].title) - has(memos[a].title)) || ((memos[b].ts || 0) - (memos[a].ts || 0)))
      .slice(0, 40);
    // 문서 (이름은 즉시, 본문은 색인을 불러온 뒤)
    const text = await ensureDocText();
    if (seq !== searchSeq) return;   // 그 사이 검색어가 바뀜
    const docIds = Object.keys(docs);
    const unindexed = docIds.filter(id => !docs[id].indexed && !/\.(png|jpe?g|gif|webp|bmp)$/i.test(docs[id].name)).length;

    memoListEl.innerHTML = "";
    memoListEl.appendChild(group(`메모 (${memoHits.length})`));
    if (!memoHits.length) { const n = document.createElement("div"); n.className = "search-note"; n.textContent = "일치하는 메모 없음"; memoListEl.appendChild(n); }
    memoHits.forEach(id => {
      const m = memos[id];
      const it = item((m.pinned ? "📌 " : "") + (m.title || "제목 없음") + (m.folder ? `  · 📁 ${m.folder}` : ""));
      if (has(m.content)) it.appendChild(snippetEl(m.content, q));
      it.addEventListener("click", () => {
        sidebarClickMemo(id);
        const idx = panels.findIndex(pp => pp && pp.memoId === id && !pp.docId);
        if (idx >= 0) setTimeout(() => focusMemoMatch(idx, q), 60);
      });
      memoListEl.appendChild(it);
    });

    memoListEl.appendChild(group("문서"));
    let shown = 0;
    for (const id of docIds) {
      const d = docs[id];
      const pages = (text[id] && text[id].pages) || [];
      const hits = [];
      pages.forEach((t, i) => { if (has(t)) hits.push({ page: i + 1, t }); });
      const nameHit = has(d.name);
      if (!hits.length && !nameHit) continue;
      shown++;
      const it = item("📄 " + d.name + (hits.length ? (pages.length > 1 ? `  · ${hits.length}쪽에서 발견` : "  · 본문 일치") : ""));
      memoListEl.appendChild(it);
      it.addEventListener("click", () => openDocInRight(id, hits.length ? { page: pages.length > 1 ? hits[0].page : undefined, find: q } : undefined));
      hits.slice(0, 3).forEach(h => {
        const sub = document.createElement("div");
        sub.style.marginTop = "4px";
        if (pages.length > 1) { const pg = document.createElement("span"); pg.style.cssText = "color:#6a9fd8;font-size:10px;margin-right:6px"; pg.textContent = `p.${h.page}`; sub.appendChild(pg); }
        sub.appendChild(snippetEl(h.t, q));
        sub.addEventListener("click", (e) => { e.stopPropagation(); openDocInRight(id, { page: pages.length > 1 ? h.page : undefined, find: q }); });
        it.appendChild(sub);
      });
    }
    if (!shown) { const n = document.createElement("div"); n.className = "search-note"; n.textContent = "일치하는 문서 없음"; memoListEl.appendChild(n); }
    if (unindexed) {
      const n = document.createElement("div");
      n.className = "search-note";
      n.textContent = `※ 아직 한 번도 열지 않은 문서 ${unindexed}개는 본문이 검색되지 않습니다. 열어보면 자동으로 색인됩니다.`;
      memoListEl.appendChild(n);
    }
  }
  let searchTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchQuery = searchInput.value.trim(); renderList(); }, 250);
  });
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { searchInput.value = ""; searchQuery = ""; renderList(); searchInput.blur(); }
  });

  // ── 메모 목록: 고정 → 폴더별 → 미분류, 정렬/태그 필터 ──
  let memoSort = "recent";
  let tagFilter = null;
  let collapsedFolders = new Set();
  try { memoSort = localStorage.getItem("memoSort") || "recent"; collapsedFolders = new Set(JSON.parse(localStorage.getItem("collapsedFolders")) || []); } catch (e) {}
  const sortSelect = document.getElementById("sort-select");
  const tagFilterEl = document.getElementById("tag-filter");
  sortSelect.value = memoSort;
  sortSelect.addEventListener("change", () => {
    memoSort = sortSelect.value;
    try { localStorage.setItem("memoSort", memoSort); } catch (e) {}
    renderList();
  });

  function renderList() {
    if (searchQuery) { renderSearchResults(); return; }
    memoListEl.innerHTML = "";
    // 태그 필터 칩
    const allTags = [...new Set(Object.values(memos).flatMap(m => m.tags || []))].sort();
    if (tagFilter && !allTags.includes(tagFilter)) tagFilter = null;
    tagFilterEl.innerHTML = "";
    allTags.forEach(t => {
      const chip = document.createElement("span");
      chip.className = "tag-chip" + (t === tagFilter ? " on" : "");
      chip.textContent = "#" + t;
      chip.addEventListener("click", () => { tagFilter = tagFilter === t ? null : t; renderList(); });
      tagFilterEl.appendChild(chip);
    });

    const ids = Object.keys(memos).filter(id => !tagFilter || (memos[id].tags || []).includes(tagFilter));
    if (ids.length === 0) {
      memoListEl.innerHTML = `<div style="padding:10px 14px;color:#555;font-size:11px;">${Object.keys(memos).length ? "조건에 맞는 메모 없음" : "메모 없음"}</div>`;
      return;
    }
    const cmp = {
      recent:  (a, b) => (memos[b].ts || 0) - (memos[a].ts || 0),
      created: (a, b) => (memos[b].created || 0) - (memos[a].created || 0),
      title:   (a, b) => (memos[a].title || "").localeCompare(memos[b].title || "", "ko")
    }[memoSort];
    ids.sort(cmp);

    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    const addItem = (id) => {
      const m = memos[id];
      const item = document.createElement("div");
      const inMain = id === id0, inSub = id === id1;
      item.className = "memo-item" + (inMain && inSub ? " active-both" : inMain ? " active-main" : inSub ? " active-sub" : "");
      const titleSpan = document.createElement("span");
      titleSpan.className = "memo-item-title";
      titleSpan.textContent = (m.pinned ? "📌 " : "") + (m.title || "제목 없음");
      item.appendChild(titleSpan);
      if (m.tags && m.tags.length) {
        const tg = document.createElement("span");
        tg.className = "memo-item-tags";
        tg.textContent = m.tags.map(t => "#" + t).join(" ");
        item.appendChild(tg);
      }
      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "×";
      delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteMemo(id); });
      item.appendChild(delBtn);
      item.addEventListener("click", () => sidebarClickMemo(id));
      memoListEl.appendChild(item);
    };
    const addHead = (label, key) => {
      const h = document.createElement("div");
      h.className = "folder-head";
      const closed = collapsedFolders.has(key);
      h.textContent = (closed ? "▸ " : "▾ ") + label;
      h.addEventListener("click", () => {
        closed ? collapsedFolders.delete(key) : collapsedFolders.add(key);
        try { localStorage.setItem("collapsedFolders", JSON.stringify([...collapsedFolders])); } catch (e) {}
        renderList();
      });
      memoListEl.appendChild(h);
      return closed;
    };

    const pinned = ids.filter(id => memos[id].pinned);
    const rest = ids.filter(id => !memos[id].pinned);
    const folders = [...new Set(rest.map(id => memos[id].folder).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
    if (pinned.length && !addHead("📌 고정", "__pinned")) pinned.forEach(addItem);
    if (!folders.length) {
      if (pinned.length && rest.length && addHead("메모", "__rest")) return;
      rest.forEach(addItem);
      return;
    }
    for (const f of folders) {
      if (!addHead("📁 " + f, "f:" + f)) rest.filter(id => memos[id].folder === f).forEach(addItem);
    }
    const none = rest.filter(id => !memos[id].folder);
    if (none.length && !addHead("미분류", "__none")) none.forEach(addItem);
  }

  newBtn.addEventListener("click", () => {
    const newRef = push(memosRef);
    const now = Date.now();
    set(newRef, { title: "새 메모", content: "", created: now, ts: now }).then(() => loadMemoInPanel(0, newRef.key));
  });

  // 삭제 = 휴지통으로 이동 (30일 뒤 자동 삭제)
  function deleteMemo(id) {
    if (!confirm("이 메모를 휴지통으로 옮길까요?")) return;
    const m = memos[id];
    if (!m) return;
    panels.forEach((p) => {
      if (p && p.memoId === id) {
        p.memoId = null; p.dirty = false;
        p.titleEl.value = "";
        p.editorEl.innerHTML = textToHtml("");
        p.editorEl.setAttribute("data-placeholder", "메모를 선택하세요...");
        clearTimeout(p.draftTimer);
      }
    });
    clearDraft(id);
    set(ref(db, `trash/${id}`), { ...m, deletedAt: Date.now() })
      .then(() => remove(ref(db, `memos/${id}`)))
      .catch((e) => { statusEl.textContent = "❌ " + e.message; });
  }

  let trash = {};
  const trashRef = ref(db, "trash");
  const trashBtn = document.getElementById("trash-btn");
  function openTrashModal() {
    const render = (body, foot) => {
      body.innerHTML = "";
      foot.innerHTML = "";
      const ids = Object.keys(trash).sort((a, b) => trash[b].deletedAt - trash[a].deletedAt);
      if (!ids.length) { body.innerHTML = '<div class="empty">휴지통이 비어 있습니다.</div>'; foot.hidden = true; return; }
      ids.forEach(id => {
        const t = trash[id];
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("div");
        label.className = "t";
        label.innerHTML = '<div></div><div class="sub"></div>';
        label.firstChild.textContent = t.title || "제목 없음";
        const left = Math.max(0, 30 - Math.floor((Date.now() - t.deletedAt) / 86400000));
        label.lastChild.textContent = `삭제 ${new Date(t.deletedAt).toLocaleString()} · ${left}일 뒤 영구 삭제`;
        row.appendChild(label);
        row.appendChild(modalButton("복원", () => restoreFromTrash(id)));
        row.appendChild(modalButton("영구삭제", () => { if (confirm("영구 삭제하면 되돌릴 수 없습니다. 삭제할까요?")) remove(ref(db, `trash/${id}`)); }, "danger"));
        body.appendChild(row);
      });
      foot.hidden = false;
      foot.appendChild(modalButton("휴지통 비우기", () => { if (confirm("휴지통의 모든 메모를 영구 삭제할까요?")) remove(trashRef); }, "danger"));
    };
    openModal("🗑 휴지통", render);
    modalRender = render;
  }
  let modalRender = null;
  function restoreFromTrash(id) {
    const { deletedAt, ...m } = trash[id] || {};
    if (!trash[id]) return;
    const target = memos[id] ? push(memosRef).key : id;   // 같은 ID가 이미 있으면 새 ID로
    set(ref(db, `memos/${target}`), m).then(() => remove(ref(db, `trash/${id}`)));
  }
  trashBtn.addEventListener("click", openTrashModal);

  // 메모·문서 목록이 모두 도착하면 새로고침 전 상태(분할 여부, 각 패널의 메모/문서)를 한 번 복원한다.
  let memosReady = false, docsReady = false, restored = false;
  function tryRestore() {
    if (restored || !memosReady || !docsReady) return;
    restored = true;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("panelDocs")); } catch (e) {}
    if (!saved) return;
    if (saved.split && !splitOn) setSplit(true);
    (saved.memoIds || []).forEach((id, i) => {
      if (id && memos[id] && panels[i] && !panels[i].memoId) loadMemoInPanel(i, id);
    });
    (saved.ids || []).forEach((id, i) => {
      if (id && docs[id] && panels[i]) openDoc(i, id);
    });
  }

  const unsubs = [];
  function startSync() {
  unsubs.push(onValue(memosRef, (snapshot) => {
    memos = snapshot.val() || {};
    statusEl.textContent = "✅ 연결됨";
    // 열려있는 패널: 다른 기기/탭에서 바뀐 내용은 편집 중이 아니면 바로 반영, 편집 중이면 충돌 경고
    panels.forEach((p, i) => {
      if (!p || !p.memoId || !memos[p.memoId]) return;
      const m = memos[p.memoId];
      if (m.pins) pins[p.memoId] = new Set(m.pins);
      if ((m.ts || 0) > p.baseTs) {
        if (p.dirty) p.panelEl.querySelector(".conflict-note").hidden = false;
        else if (!p.docId) loadMemoInPanel(i, p.memoId, { sync: true });
      }
    });
    renderList();
    memosReady = true;
    tryRestore();
  }, (e) => { statusEl.textContent = "❌ " + e.message; memosReady = true; tryRestore(); }));
  }

  // ── 휴지통 구독 (30일 지난 항목은 자동 삭제) ──
  function startTrashSync() {
    let purged = false;
    unsubs.push(onValue(ref(db, "trash"), (snap) => {
      trash = snap.val() || {};
      trashBtn.textContent = "🗑 휴지통" + (Object.keys(trash).length ? ` (${Object.keys(trash).length})` : "");
      if (!purged) {
        purged = true;
        Object.entries(trash).forEach(([id, t]) => { if (Date.now() - (t.deletedAt || 0) > 30 * 86400000) remove(ref(db, `trash/${id}`)); });
      }
      if (modalEl && modalRender && modalEl.querySelector(".modal-head span").textContent.includes("휴지통"))
        modalRender(modalEl.querySelector(".modal-body"), modalEl.querySelector(".modal-foot"));
    }, () => {}));
  }

  // ── 문서 목록 구독 ──
  function startDocSync() {
  unsubs.push(onValue(docsRef, (snapshot) => {
    docs = snapshot.val() || {};
    renderDocList();
    renderUsage();
    docsReady = true;
    tryRestore();
  }, (e) => { statusEl.textContent = "❌ " + e.message; docsReady = true; tryRestore(); }));
  }

  rebuildPanels();

  // ── 인증 상태에 따라 잠금/구독 ──
  // 로그아웃: 저장 안 된 내용은 저장을 시도하고, 이 브라우저에 남은 문서 사본(캐시)은 지운다
  async function doLogout() {
    panels.forEach((p, i) => { if (p && p.memoId && p.dirty) savePanel(i, true); });
    await new Promise(r => setTimeout(r, 800));
    try { await caches.delete("docs-v1"); } catch (e) {}
    await signOut(auth);
    location.reload();  // 메모리의 데이터까지 깨끗이 비움
  }
  document.getElementById("logout-btn").addEventListener("click", doLogout);

  // ── 자동 잠금: 일정 시간 아무 조작이 없으면 로그아웃 ──
  const IDLE_OPTIONS = [0, 5, 15, 30, 60];   // 분 (0 = 사용 안 함)
  let idleMinutes = 30;
  try { const v = parseInt(localStorage.getItem("idleMinutes"), 10); if (IDLE_OPTIONS.includes(v)) idleMinutes = v; } catch (e) {}
  const lockBtn = document.getElementById("lock-btn");
  const renderLockBtn = () => { lockBtn.textContent = idleMinutes ? `⏱ 자동잠금 ${idleMinutes}분` : "⏱ 자동잠금 끔"; };
  renderLockBtn();
  lockBtn.addEventListener("click", () => {
    idleMinutes = IDLE_OPTIONS[(IDLE_OPTIONS.indexOf(idleMinutes) + 1) % IDLE_OPTIONS.length];
    try { localStorage.setItem("idleMinutes", String(idleMinutes)); } catch (e) {}
    renderLockBtn();
  });
  let lastActivity = Date.now(), loggedIn = false;
  ["mousemove", "mousedown", "keydown", "touchstart", "wheel", "scroll"].forEach(ev =>
    document.addEventListener(ev, () => { lastActivity = Date.now(); }, { capture: true, passive: true }));
  setInterval(() => {
    if (loggedIn && idleMinutes && Date.now() - lastActivity > idleMinutes * 60000) { loggedIn = false; doLogout(); }
  }, 15000);
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loggedIn = true;
      lastActivity = Date.now();
      lockScreen.style.display = "none";
      if (!synced) { synced = true; startSync(); startDocSync(); startTrashSync(); subscribeUsage(); }
    } else {
      lockScreen.style.display = "flex";
      statusEl.textContent = "🔒 로그인 필요";
      emailInput.focus();
    }
  });

</script>
</body>
</html>
