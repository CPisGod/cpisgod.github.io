<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>메모장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main: #f5f5f0;
      --bg-editor: #fffffe;
      --bg-preview: #fafaf8;
      --text-main: #222;
      --border-main: #333;
      --border-light: #ddd;
      --gutter-bg: #f0f0ec;
      --placeholder: #ccc;
    }
    html.dark {
      --bg-main: #1c1c1c;
      --bg-editor: #242424;
      --bg-preview: #202020;
      --text-main: #e0e0e0;
      --border-main: #999;
      --border-light: #3a3a3a;
      --gutter-bg: #2a2a2a;
      --placeholder: #555;
    }

    body {
      background: var(--bg-main);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.2s;
    }

    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #222;
      color: #ddd;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar-header {
      padding: 16px 14px 10px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
    }
    #new-btn {
      margin: 10px 10px 4px;
      background: #444;
      color: #eee;
      border: none;
      padding: 7px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #new-btn:hover { background: #555; }
    #split-toggle {
      margin: 4px 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #split-toggle:hover { background: #333; color: #bbb; }
    #split-toggle.on { background: #3a3a3a; color: #eee; border-color: #555; }
    #theme-toggle {
      margin: 0 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #theme-toggle:hover { background: #333; color: #bbb; }

    #memo-list { flex: 1; overflow-y: auto; min-height: 60px; }
    #search-input {
      margin: 10px 10px 0; width: calc(100% - 20px); background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a;
      padding: 7px 8px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; outline: none;
    }
    #search-input:focus { border-color: #5a9a5a; }
    .search-group { padding: 6px 14px; font-size: 10px; letter-spacing: 1px; color: #777; background: #1e1e1e; border-bottom: 1px solid #2a2a2a; }
    .search-item { padding: 8px 14px; border-bottom: 1px solid #2e2e2e; cursor: pointer; font-size: 12px; color: #bbb; }
    .search-item:hover { background: #2a2a2a; }
    .search-item .s-title { color: #ddd; }
    .search-item .s-snip { color: #888; font-size: 11px; margin-top: 2px; line-height: 1.5; word-break: break-all; }
    .search-item .s-snip b { color: #f0c060; font-weight: 500; }
    .search-note { padding: 8px 14px; font-size: 11px; color: #666; }
    .side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 10px 8px; }
    .side-grid button {
      background: #2a2a2a; color: #888; border: 1px solid #3a3a3a; padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif; font-size: 11px; cursor: pointer;
    }
    .side-grid button:hover { background: #333; color: #bbb; }
    #memo-controls { padding: 4px 10px; border-top: 1px solid #2a2a2a; }
    #sort-select {
      width: 100%; background: #2a2a2a; color: #999; border: 1px solid #3a3a3a; padding: 4px;
      font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
    }
    #tag-filter { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag-chip { background: #2a2a2a; color: #999; border: 1px solid #3a3a3a; padding: 1px 7px; font-size: 10px; cursor: pointer; border-radius: 9px; }
    .tag-chip.on { background: #3d5a3d; color: #cfe8cf; border-color: #5a9a5a; }
    .folder-head {
      padding: 6px 14px; font-size: 10px; letter-spacing: 1px; color: #777; cursor: pointer;
      background: #1e1e1e; border-bottom: 1px solid #2a2a2a; user-select: none;
    }
    .folder-head:hover { color: #aaa; }
    .memo-item-tags { color: #6b6b6b; font-size: 10px; margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
    #doc-header {
      padding: 8px 14px 6px; font-size: 10px; letter-spacing: 2px; color: #777;
      border-top: 1px solid #333; border-bottom: 1px solid #2e2e2e;
    }
    #doc-list { max-height: 28vh; overflow-y: auto; }
    #usage { padding: 8px 14px 4px; font-size: 10px; color: #888; border-top: 1px solid #2a2a2a; }
    #usage .u-row { display: flex; justify-content: space-between; margin-top: 4px; }
    #usage .u-bar { height: 3px; background: #333; margin-top: 2px; }
    #usage .u-fill { height: 100%; background: #5a9a5a; }
    #usage .u-fill.warn { background: #d9a441; }
    #usage .u-fill.over { background: #e03131; }
    .doc-item.active { background: #3a2d2d; color: #bc8f8f; }
    .memo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid #2e2e2e;
      font-size: 12px;
      color: #bbb;
    }
    .memo-item:hover { background: #2a2a2a; }
    .memo-item.active-main { background: #2d3a2d; color: #8fbc8f; }
    .memo-item.active-sub  { background: #2d2d3a; color: #8f8fbc; }
    .memo-item.active-both { background: #3a3a2d; color: #bcbc8f; }
    .memo-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 15px;
      cursor: pointer;
      padding: 0 0 0 6px;
    }
    .delete-btn:hover { color: #f55; }
    #status {
      padding: 8px 14px;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #2a2a2a;
      min-height: 30px;
    }

    #panels {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .panel + .panel { border-left: 3px solid #bbb; }

    .divider {
      width: 4px;
      background: #ccc;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      z-index: 10;
    }
    .divider:hover, .divider.dragging { background: #888; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-main);
      flex-shrink: 0;
    }
    .panel-title-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #aaa;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
      outline: none;
      padding: 3px 0;
      min-width: 0;
    }
    .panel-title-input:focus { border-bottom-color: #000; }
    .panel-title-input::placeholder { color: var(--placeholder); }
    .save-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 7px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .save-btn:hover { background: #000; }
    .save-btn:disabled { background: #aaa; cursor: default; }

    .panel:nth-child(1) .panel-header { border-top: 3px solid #5a9a5a; }
    .panel:nth-child(3) .panel-header { border-top: 3px solid #5a5a9a; }

    .editor-wrap {
      flex: 1;
      display: flex;
      background: var(--bg-editor);
      overflow: hidden;
      position: relative;
    }

    .gutter {
      width: 28px;
      min-width: 28px;
      background: var(--gutter-bg);
      border-right: 1px solid var(--border-light);
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    /* 거터 내부 절대 위치 컨테이너 */
    .gutter-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .gutter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
    }
    .gutter-row:hover .pin-dot:not(.on) { opacity: 0.3; }
    .pin-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e03131;
      opacity: 0;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }
    .pin-dot.on { opacity: 1; }

    .memo-editor {
      flex: 1;
      padding: 18px 20px;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: text;
    }
    .memo-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--placeholder);
      pointer-events: none;
    }
    .memo-editor p {
      line-height: 2.0;
      margin: 0;
      min-height: 1.2em;
    }

    .panel-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      font-size: 11px;
      color: #aaa;
      background: var(--bg-main);
      border-top: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .selcount:empty { display: none; }
    .panel-bottom { justify-content: space-between; }
    .bottom-right { display: inline-flex; gap: 8px; margin-left: auto; }
    .fmt-bar { display: inline-flex; gap: 3px; }
    .fmt-bar button {
      background: transparent; color: #999; border: 1px solid var(--border-light); padding: 1px 7px;
      font-size: 11px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .fmt-bar button:hover { background: var(--gutter-bg); color: var(--text-main); }
    .conflict-note { color: #e8590c; font-weight: 500; }
    .conflict-note[hidden] { display: none; }
    .panel.doc-open .fmt-bar, .panel.doc-open .conflict-note { display: none; }
    .meta-btn { background: transparent; border: 1px solid var(--border-light); color: var(--text-main); padding: 6px 9px; cursor: pointer; flex-shrink: 0; font-size: 12px; }
    .meta-btn:hover { background: var(--gutter-bg); }
    .meta-btn.has { border-color: #5a9a5a; }
    /* 마크다운식 줄 서식: 저장은 순수 텍스트(접두어)이고 화면에서만 꾸민다 */
    .memo-editor p.md-h1 { font-size: 1.5em; font-weight: 700; line-height: 1.5; }
    .memo-editor p.md-h2 { font-size: 1.25em; font-weight: 600; line-height: 1.6; }
    .memo-editor p.md-quote { border-left: 3px solid #aaa; padding-left: 10px; color: #777; }
    .memo-editor p.md-done { text-decoration: line-through; color: #999; }
    #meta-pop {
      position: fixed; z-index: 10000; display: none; background: #2a2a2a; color: #eee; padding: 10px;
      border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.45); font-size: 12px; width: 240px;
    }
    #meta-pop label { display: block; margin: 6px 0 2px; color: #aaa; }
    #meta-pop input[type="text"] { width: 100%; background: #1f1f1f; color: #eee; border: 1px solid #555; padding: 5px 7px; font-size: 12px; outline: none; font-family: 'Noto Sans KR', sans-serif; }
    #meta-pop .pin-row { margin-top: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9000; display: flex; align-items: center; justify-content: center; }
    .modal-box {
      background: #262626; color: #ddd; width: 520px; max-width: calc(100% - 24px); max-height: 80vh; display: flex; flex-direction: column;
      border: 1px solid #444; box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #3a3a3a; font-weight: 500; }
    .modal-head button { background: none; border: none; color: #999; font-size: 16px; cursor: pointer; }
    .modal-body { padding: 12px 16px; overflow-y: auto; }
    .modal-foot { padding: 10px 16px; border-top: 1px solid #3a3a3a; display: flex; gap: 8px; justify-content: flex-end; }
    .modal-box button.btn { background: #3a3a3a; color: #eee; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; }
    .modal-box button.btn:hover { background: #4a4a4a; }
    .modal-box button.btn.danger:hover { background: #8a2b2b; }
    .modal-box .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #333; }
    .modal-box .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .modal-box .row .sub { color: #888; font-size: 11px; }
    .modal-box .stack { display: flex; flex-direction: column; gap: 8px; }
    .modal-box .sec { margin: 12px 0 4px; font-weight: 500; color: #ccc; }
    .modal-box .ann-row { display: flex; gap: 8px; padding: 7px 4px; border-bottom: 1px solid #333; cursor: pointer; }
    .modal-box .ann-row:hover { background: #2e2e2e; }
    .modal-box .ann-row .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .modal-box .ann-row .q { color: #ddd; }
    .modal-box .ann-row .n { color: #f0b86e; margin-top: 2px; white-space: pre-wrap; }
    .modal-box .ann-row .pg { color: #888; font-size: 11px; }
    .modal-box .empty { color: #888; text-align: center; padding: 20px; }

    .memo-editor.font-consolas,
    .memo-editor.font-consolas p {
      font-family: 'Consolas', 'D2Coding', monospace;
    }

    /* ── 문서 뷰어 (PDF / DOCX / HWPX) ── */
    .doc-btn {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      padding: 6px 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .doc-btn:hover { background: var(--gutter-bg); }
    .panel.doc-open .editor-wrap,
    .panel.doc-open .panel-bottom { display: none; }
    .panel.drag-over { outline: 3px dashed #5a9a5a; outline-offset: -3px; }
    .doc-view {
      position: relative;
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-preview);
      min-height: 0;
    }
    .panel.doc-open .doc-view { display: flex; }
    .doc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 16px;
      font-size: 12px;
      background: var(--bg-main);
      color: var(--text-main);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .doc-bar { flex-wrap: wrap; }
    .doc-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
    .pdf-nav, .zoom-ctl { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
    .pdf-nav[hidden], .zoom-ctl[hidden], .find-btn[hidden], .rect-btn[hidden], .find-bar[hidden] { display: none; }
    .pdf-nav button, .zoom-ctl button, .find-btn, .rect-btn, .find-bar button {
      background: transparent; color: var(--text-main); border: 1px solid var(--border-light);
      padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .pdf-nav button:hover, .zoom-ctl button:hover, .find-btn:hover, .rect-btn:hover, .find-bar button:hover { background: var(--gutter-bg); }
    .rect-btn.on { background: #e8590c; color: #fff; border-color: #e8590c; }
    .pg-input { width: 46px; text-align: center; font-size: 12px; padding: 2px; background: var(--bg-editor); color: var(--text-main); border: 1px solid var(--border-light); }
    .zoom-val { min-width: 38px; text-align: center; }
    .find-bar {
      display: flex; align-items: center; gap: 6px; padding: 5px 16px; flex-shrink: 0;
      background: var(--bg-main); border-bottom: 1px solid var(--border-light); font-size: 12px; color: var(--text-main);
    }
    .find-input { flex: 1; max-width: 260px; padding: 4px 8px; font-size: 12px; background: var(--bg-editor); color: var(--text-main); border: 1px solid var(--border-light); outline: none; }
    .find-count { min-width: 50px; color: #888; }
    mark.find { background: rgba(255, 212, 59, .75); color: inherit; }
    mark.find.cur { background: rgba(255, 146, 43, .9); }
    .doc-pdf mark.find { background: #ffd43b; }
    .doc-pdf mark.find.cur { background: #ff922b; }
    .doc-imgwrap { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .doc-imgwrap img { display: block; width: 100%; height: auto; }
    .ann-rect {
      position: absolute; z-index: 3; box-sizing: border-box; border: 2px solid #f08c00;
      background: rgba(255, 224, 102, .25); cursor: pointer;
    }
    .ann-rect[data-color="g"] { border-color: #2f9e44; background: rgba(140, 233, 154, .25); }
    .ann-rect[data-color="b"] { border-color: #1971c2; background: rgba(116, 192, 252, .25); }
    .ann-rect[data-color="p"] { border-color: #c2255c; background: rgba(250, 162, 193, .25); }
    .ann-rect.drawing { pointer-events: none; border-style: dashed; }
    .ann-rect.has-note { box-shadow: 0 0 0 2px rgba(232, 89, 12, .5); }
    .ann-rect.flash { outline: 3px solid #e8590c; }
    .rect-mode .doc-body { cursor: crosshair; }
    .rect-mode .textLayer, .rect-mode .ann-rect { pointer-events: none; }
    .doc-actions button, .doc-actions input { font-family: 'Noto Sans KR', sans-serif; }
    .ann-count {
      background: transparent; color: var(--text-main); border: 1px solid var(--border-light);
      padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .ann-count[hidden], .ann-list[hidden] { display: none; }
    .ann-count:hover { background: var(--gutter-bg); }
    .ann-list {
      position: absolute; top: 34px; right: 12px; z-index: 20; width: 300px; max-width: calc(100% - 24px);
      max-height: 55%; overflow-y: auto; background: #2a2a2a; color: #ddd;
      border: 1px solid #444; box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: 12px;
    }
    .ann-item { display: flex; gap: 8px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #383838; }
    .ann-item:hover { background: #333; }
    .ann-chip { width: 10px; height: 10px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
    .ann-item-quote { color: #ccc; }
    .ann-item-note { color: #f0b86e; margin-top: 3px; white-space: pre-wrap; }
    .ann-empty { padding: 14px; text-align: center; color: #888; line-height: 1.6; }
    .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-close {
      background: #333; color: #fff; border: none;
      padding: 4px 12px; font-size: 12px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0;
    }
    .doc-close:hover { background: #000; }
    .doc-body { flex: 1; overflow: auto; padding: 16px; }
    .doc-msg { color: #888; font-size: 13px; padding: 20px; text-align: center; }
    .pdf-page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .pdf-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
    /* pdf.js 텍스트 레이어: 투명 글자를 캔버스 위에 겹쳐 드래그/복사/하이라이트를 가능하게 함 */
    .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; }
    .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: rgba(0, 90, 255, .3); }
    mark.ann { background: rgba(255, 224, 102, .6); color: inherit; border-radius: 2px; cursor: pointer; }
    mark.ann[data-color="g"] { background: rgba(140, 233, 154, .6); }
    mark.ann[data-color="b"] { background: rgba(116, 192, 252, .55); }
    mark.ann[data-color="p"] { background: rgba(250, 162, 193, .6); }
    /* PDF: 하이라이트는 canvas 아래에 깔리고 canvas가 multiply로 겹쳐져 글자가 선명하게 유지된다 */
    .pdf-page { isolation: isolate; }
    .doc-pdf mark.ann { background: #ffe066; }
    .doc-pdf mark.ann[data-color="g"] { background: #8ce99a; }
    .doc-pdf mark.ann[data-color="b"] { background: #74c0fc; }
    .doc-pdf mark.ann[data-color="p"] { background: #faa2c1; }
    mark.ann.has-note { border-bottom: 2px solid #e8590c; }
    mark.ann.flash { outline: 3px solid #e8590c; }
    #ann-pop {
      position: fixed; z-index: 10000; display: none; background: #2a2a2a; color: #eee; padding: 6px;
      border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.45); font-size: 12px; max-width: 260px;
    }
    #ann-pop .ann-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; margin: 0 3px 0 0; vertical-align: middle; }
    #ann-pop .ann-dot.cur { border-color: #fff; }
    #ann-pop .ann-btn { background: #3a3a3a; color: #eee; border: none; padding: 4px 8px; margin-left: 4px; cursor: pointer; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; vertical-align: middle; }
    #ann-pop .ann-btn:hover { background: #4a4a4a; }
    #ann-pop .ann-note { display: block; width: 240px; margin-top: 6px; background: #1f1f1f; color: #eee; border: 1px solid #555; padding: 6px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; resize: vertical; outline: none; }
    #ann-pop .ann-quote { margin-top: 4px; color: #999; font-size: 11px; }
    .doc-page {
      background: #fff; color: #222;
      max-width: 820px; margin: 0 auto; padding: 32px 36px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      font-family: 'Noto Serif KR', serif; font-size: 15px; line-height: 1.8;
      word-break: break-word; overflow-x: auto;
    }
    .doc-page p { min-height: 1.2em; margin: 0 0 .3em; }
    .doc-page img { max-width: 100%; height: auto; }
    .doc-page table { border-collapse: collapse; margin: 8px 0; max-width: 100%; }
    .doc-page.hwpx { font-size: 10pt; line-height: 1.6; }
    .doc-page.hwpx p { margin: 0; }
    .doc-page .hwpx-noimg { color: #999; font-size: .85em; }
    .doc-page td, .doc-page th { border: 1px solid #999; padding: 4px 8px; vertical-align: top; }
    .doc-page h1, .doc-page h2, .doc-page h3 { margin: .8em 0 .4em; }
    .doc-page ul, .doc-page ol { margin: .4em 0 .4em 1.6em; }

    /* ── 모바일 최적화 ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      #sidebar {
        width: 100%;

        max-height: 40vh;

      /* 분할 모드는 모바일에서 세로로 전환 */
      .panel + .panel { border-left: none; border-top: 3px solid #bbb; }
      .divider { display: none !important; }
    }
  </style>

<body>

<div id="panels"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, push, update, increment, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getStorage, ref as sRef, uploadBytesResumable, getBytes, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDgjizBR_P_ccjZczxcvCLmVuUi2wKIQYU",
    authDomain:        "memo-acd0e.firebaseapp.com",
    databaseURL:       "https://memo-acd0e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "memo-acd0e",
    storageBucket:     "memo-acd0e.firebasestorage.app",
    messagingSenderId: "116520806995",
    appId:             "1:116520806995:web:abbafb950052296db8b4a6",
    measurementId:     "G-9H3GX7SWKG"
  };

  const app = initializeApp(firebaseConfig);

  // ── 로그인 (Firebase Auth 이메일/비밀번호) ──
  const lockScreen = document.getElementById("lock-screen");
  const emailInput = document.getElementById("email-input");
  const pwInput    = document.getElementById("pw-input");
  const pwError    = document.getElementById("pw-error");
  const auth       = getAuth(app);

  function showLoginError(msg) {
    pwError.textContent = msg;
    setTimeout(() => { pwError.textContent = ""; }, 3000);
  }
  async function doLogin() {
    const email = emailInput.value.trim(), pw = pwInput.value;
    if (!email || !pw) return;
    pwError.textContent = "로그인 중...";
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      pwInput.value = "";
    } catch (e) {
      pwInput.value = "";
      showLoginError(e.code === "auth/too-many-requests"
        ? "시도가 너무 많습니다. 잠시 후 다시 시도하세요."
        : "이메일 또는 비밀번호가 틀렸습니다.");
    }
  }
  [emailInput, pwInput].forEach(el => el.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }));
  setTimeout(() => emailInput.focus(), 100);

  // ── 모바일 사이드바 접기/펼치기 ──
  const sidebarHeader = document.getElementById("sidebar-header");
  const sidebarEl     = document.getElementById("sidebar");
  sidebarHeader.addEventListener("click", () => {
    if (window.innerWidth <= 768) {
      sidebarEl.classList.toggle("collapsed");
    }
  });

  // ── 다크모드 토글 (세션 중에만 유지) ──
  const themeToggle = document.getElementById("theme-toggle");
  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    themeToggle.textContent = dark ? "☀️ 라이트모드" : "🌙 다크모드";
  }
  themeToggle.addEventListener("click", () => {
    applyTheme(!document.documentElement.classList.contains("dark"));
  });

  const db       = getDatabase(app);
  const memosRef = ref(db, "memos");
  const docsRef  = ref(db, "docs");
  const storage  = getStorage(app);

  const panelsEl    = document.getElementById("panels");
  const memoListEl  = document.getElementById("memo-list");
  const statusEl    = document.getElementById("status");
  const newBtn      = document.getElementById("new-btn");
  const splitToggle = document.getElementById("split-toggle");
  const docListEl   = document.getElementById("doc-list");
  const usageEl     = document.getElementById("usage");

  let memos   = {};
  let docs    = {};          // RTDB에 저장된 문서 메타 { id: {name, path, size} }
  const localDocs = {};      // 업로드 실패 시 이번 세션에서만 볼 수 있는 임시 문서
  const docCache  = new Map(); // id -> ArrayBuffer (재다운로드 방지)
  const getDoc = (id) => docs[id] || localDocs[id];
  let splitOn = false;
  let pins    = {};  // { memoId: Set<paraIdx> }
  let panels  = [];

  function getPins(id) {
    if (!pins[id]) pins[id] = new Set();
    return pins[id];
  }

  function textToHtml(text) {
    if (!text) return "<p><br></p>";
    return text.split("\n").map(l => `<p>${l ? esc(l) : "<br>"}</p>`).join("");
  }
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function htmlToText(el) {
    return Array.from(el.querySelectorAll("p")).map(p =>
      (p.innerHTML === "<br>" || p.innerHTML === "") ? "" : p.innerText
    ).join("\n");
  }

  // ── 공통 모달 / 다운로드 ──
  let modalEl = null;
  function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
  function openModal(title, build) {
    closeModal();
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal-box"><div class="modal-head"><span></span><button title="닫기">✕</button></div><div class="modal-body"></div><div class="modal-foot" hidden></div></div>';
    bg.querySelector(".modal-head span").textContent = title;
    bg.querySelector(".modal-head button").addEventListener("click", closeModal);
    bg.addEventListener("mousedown", (e) => { if (e.target === bg) closeModal(); });
    document.body.appendChild(bg);
    modalEl = bg;
    build(bg.querySelector(".modal-body"), bg.querySelector(".modal-foot"));
    return bg;
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalEl) closeModal(); });
  function modalButton(label, onClick, cls = "") {
    const b = document.createElement("button");
    b.className = "btn " + cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }
  function downloadBlob(name, data, mime) {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const safeName = (t) => (t || "제목 없음").replace(/[\\/:*?"<>|\n\r]+/g, "_").slice(0, 60);

  // ── 거터 렌더링 ──
  // 각 <p>의 offsetTop, offsetHeight를 그대로 반영해서 정확히 맞춤
  function renderGutter(panelIdx) {
    const p = panels[panelIdx];
    if (!p || !p.gutterEl || !p.editorEl) return;

    const pinSet    = p.memoId ? getPins(p.memoId) : new Set();
    const paras     = p.editorEl.querySelectorAll("p");
    const inner     = p.gutterEl.querySelector(".gutter-inner");
    if (!inner) return;
    inner.innerHTML = "";

    // 에디터 padding-top (18px)
    const editorPaddingTop = parseFloat(getComputedStyle(p.editorEl).paddingTop) || 0;

    paras.forEach((para, i) => {
      const row = document.createElement("div");
      row.className = "gutter-row";
      // <p>의 에디터 내 위치와 높이를 그대로 사용
      row.style.position = "absolute";
      row.style.top      = (para.offsetTop + editorPaddingTop - editorPaddingTop) + "px";
      row.style.height   = para.offsetHeight + "px";
      row.style.width    = "100%";

      const dot = document.createElement("div");
      dot.className = "pin-dot" + (pinSet.has(i) ? " on" : "");

      row.addEventListener("click", () => {
        pinSet.has(i) ? pinSet.delete(i) : pinSet.add(i);
        dot.classList.toggle("on");
      });

      row.appendChild(dot);
      inner.appendChild(row);
    });

    // inner 높이를 에디터 scrollHeight에 맞춤
    inner.style.height = p.editorEl.scrollHeight + "px";
  }

  // ── 줄 서식 (마크다운 접두어) ──
  const FMT_PREFIX = { h1: "# ", h2: "## ", ul: "- ", todo: "- [ ] ", quote: "> " };
  const ANY_PREFIX = /^(#{1,2} |- \[[ xX]\] |- |> )/;
  const LIST_PREFIX = /^(- \[[ xX]\] |- |> )/;
  function paraClass(text) {
    if (text.startsWith("## ")) return "md-h2";
    if (text.startsWith("# ")) return "md-h1";
    if (/^- \[[xX]\] /.test(text)) return "md-done";
    if (text.startsWith("> ")) return "md-quote";
    return "";
  }
  function styleParas(editor) {
    editor.querySelectorAll("p").forEach(pe => {
      const c = paraClass(pe.textContent);
      if (pe.className !== c) pe.className = c;
    });
  }
  function currentPara(editor) {
    const sel = window.getSelection();
    let n = sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    while (n && n !== editor) { if (n.nodeType === 1 && n.tagName === "P") return n; n = n.parentNode; }
    return null;
  }
  function selectedParas(editor) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return [];
    const r = sel.getRangeAt(0);
    const ps = Array.from(editor.querySelectorAll("p")).filter(pe => r.intersectsNode(pe));
    return ps.length ? ps : [currentPara(editor)].filter(Boolean);
  }
  function setCaretEnd(el) {
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
  function toggleLinePrefix(panelIdx, kind) {
    const p = panels[panelIdx];
    if (!p || p.docId) return;
    const paras = selectedParas(p.editorEl);
    if (!paras.length) return;
    const target = FMT_PREFIX[kind];
    const norm = (pe) => { const m = pe.textContent.match(ANY_PREFIX); return m ? m[0].replace(/\[[xX]\]/, "[ ]") : ""; };
    const allHave = paras.every(pe => norm(pe) === target);
    paras.forEach(pe => {
      const t = pe.textContent.replace(ANY_PREFIX, "");
      pe.textContent = allHave ? t : target + t;
      if (!pe.textContent) pe.innerHTML = "<br>";
    });
    setCaretEnd(paras[paras.length - 1]);
    p.editorEl.focus();
    onEditorChanged(panelIdx);
  }
  function toggleTodoDone(panelIdx) {
    const p = panels[panelIdx];
    const pe = p && currentPara(p.editorEl);
    if (!pe) return;
    const t = pe.textContent;
    if (/^- \[ \] /.test(t)) pe.textContent = t.replace("- [ ] ", "- [x] ");
    else if (/^- \[[xX]\] /.test(t)) pe.textContent = t.replace(/^- \[[xX]\] /, "- [ ] ");
    else return;
    setCaretEnd(pe);
    onEditorChanged(panelIdx);
  }
  // Enter: 목록/체크리스트/인용 줄에서는 다음 줄에 접두어를 이어 붙이고, 빈 항목에서 Enter를 치면 목록을 끝낸다
  function handleEnter(panelIdx) {
    const p = panels[panelIdx];
    const pe = currentPara(p.editorEl);
    const sel = window.getSelection();
    const m = pe && pe.textContent.match(LIST_PREFIX);
    if (m && sel.isCollapsed) {
      const pre = document.createRange();
      pre.selectNodeContents(pe);
      pre.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
      if (pre.toString().length >= m[0].length) {
        if (pe.textContent.length === m[0].length) {   // 빈 항목 → 목록 종료
          pe.innerHTML = "<br>";
          setCaretEnd(pe);
          onEditorChanged(panelIdx);
          return;
        }
        document.execCommand("insertParagraph");
        document.execCommand("insertText", false, m[0].replace(/\[[xX]\]/, "[ ]"));
        onEditorChanged(panelIdx);
        return;
      }
    }
    document.execCommand("insertParagraph");
    onEditorChanged(panelIdx);
  }

  // ── 임시 저장(draft): 저장 전에 탭이 닫히거나 오프라인이어도 내용을 잃지 않게 이 브라우저에 보관 ──
  const draftKey = (id) => "draft:" + id;
  function writeDraft(p) {
    if (!p || !p.memoId) return;
    try {
      localStorage.setItem(draftKey(p.memoId), JSON.stringify({
        title: p.titleEl.value, content: htmlToText(p.editorEl), ts: Date.now(), base: p.baseTs || 0
      }));
    } catch (e) {}
  }
  function clearDraft(id) { try { localStorage.removeItem(draftKey(id)); } catch (e) {} }
  function readDraft(id) { try { return JSON.parse(localStorage.getItem(draftKey(id))); } catch (e) { return null; } }

  function onEditorChanged(panelIdx) {
    const p = panels[panelIdx];
    if (!p) return;
    p.dirty = true;
    styleParas(p.editorEl);
    p.panelEl.querySelector(".charcount").textContent = htmlToText(p.editorEl).length + "자";
    requestAnimationFrame(() => renderGutter(panelIdx));
    clearTimeout(p.draftTimer);
    p.draftTimer = setTimeout(() => writeDraft(p), 400);
  }

  // ── 패널 DOM 생성 ──
  function createPanelEl(panelIdx) {
    const wrap = document.createElement("div");
    wrap.className = "panel";

    wrap.innerHTML = `
      <div class="panel-header">
        <input class="panel-title-input" type="text" placeholder="제목 없음" maxlength="80" />
        <button class="meta-btn" title="폴더 / 태그 / 고정">🏷</button>
        <button class="doc-btn" title="PDF / DOCX / HWPX / 이미지 열기">📄 문서</button>
        <input class="doc-file" type="file" accept=".pdf,.docx,.hwpx,.png,.jpg,.jpeg,.gif,.webp,.bmp" hidden />
        <button class="save-btn">저장</button>
      </div>
      <div class="doc-view">
        <div class="doc-bar">
          <span class="doc-name"></span>
          <span class="doc-actions">
            <span class="pdf-nav" hidden>
              <button class="pg-prev" title="이전 쪽">‹</button><input class="pg-input" type="number" min="1" value="1"><span class="pg-slash">/</span><span class="pg-total">1</span><button class="pg-next" title="다음 쪽">›</button>
            </span>
            <span class="zoom-ctl" hidden>
              <button class="zoom-out" title="축소">−</button><span class="zoom-val">100%</span><button class="zoom-in" title="확대">＋</button><button class="zoom-fit" title="폭에 맞춤">맞춤</button>
            </span>

             data-placeholder="메모를 선택하세요..."></div>

          <button data-fmt="h1" title="제목 1 (# )">H1</button><button data-fmt="h2" title="제목 2 (## )">H2</button><button data-fmt="ul" title="목록 (- )">•</button><button data-fmt="todo" title="체크리스트 (Ctrl+Enter로 체크)">☑</button><button data-fmt="quote" title="인용 (> )">❝</button><button data-fmt="export" title="이 메모를 .md로 내보내기">⬇ .md</button>
        </span>

        <span class="bottom-right"><span class="selcount"></span><span class="charcount">0자</span></span>
      </div>
    `;

    const titleInput = wrap.querySelector(".panel-title-input");
    const saveBtn    = wrap.querySelector(".save-btn");
    const gutter     = wrap.querySelector(".gutter");
    const editor     = wrap.querySelector(".memo-editor");
    const charcount  = wrap.querySelector(".charcount");
    const selcount   = wrap.querySelector(".selcount");

    const pState = { memoId: null, editorEl: editor, titleEl: titleInput, gutterEl: gutter, selCountEl: selcount, dirty: false,
                     baseTs: 0, draftTimer: null,
                     panelEl: wrap, docId: null, docToken: 0,
                     anns: {}, orphans: new Set(), docReady: false, pendingEdit: null, pendingJump: null,
                     annsLoaded: false, docKind: "text", docExt: "", docBuf: null, zoom: 1, pdfSeq: 0, pdfIOs: [], pdfPages: 0,
                     rectMode: false, posReady: false, find: { q: "", n: 0, cur: -1 } };
    panels[panelIdx] = pState;

    // 문서 열기: 버튼 / 드래그앤드롭
    const docBtn   = wrap.querySelector(".doc-btn");
    const docInput = wrap.querySelector(".doc-file");
    docBtn.addEventListener("click", () => docInput.click());
    docInput.addEventListener("change", () => {

    const annList = wrap.querySelector(".ann-list");

    const docBody = wrap.querySelector(".doc-body");

    docBody.addEventListener("scroll", () => {

    docBody.addEventListener("mousedown", (e) => startRect(panelIdx, e));
    wrap.addEventListener("mousedown", () => { lastDocPanel = panelIdx; }, true);

    // 도구 모음
    const q = (sel) => wrap.querySelector(sel);
    q(".pg-prev").addEventListener("click", () => jumpPage(pState, currentPage(pState) - 1));
    q(".pg-next").addEventListener("click", () => jumpPage(pState, currentPage(pState) + 1));
    q(".pg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { jumpPage(pState, parseInt(e.target.value, 10) || 1); e.target.blur(); } });
    q(".zoom-in").addEventListener("click", () => stepZoom(pState, 1));
    q(".zoom-out").addEventListener("click", () => stepZoom(pState, -1));
    q(".zoom-fit").addEventListener("click", () => setZoom(pState, 1));
    q(".rect-btn").addEventListener("click", () => setRectMode(pState, !pState.rectMode));
    q(".find-btn").addEventListener("click", () => openFind(pState));
    q(".find-close").addEventListener("click", () => closeFind(pState));
    q(".find-next").addEventListener("click", () => findStep(pState, 1));
    q(".find-prev").addEventListener("click", () => findStep(pState, -1));
    let findTimer = null;
    q(".find-input").addEventListener("input", (e) => {

      findTimer = setTimeout(() => runFind(pState, e.target.value), 200);

    q(".find-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); clearTimeout(findTimer); if (pState.find.q !== e.target.value) runFind(pState, e.target.value); else findStep(pState, e.shiftKey ? -1 : 1); }

    wrap.addEventListener("dragover", (e) => {

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleTodoDone(panelIdx); return; }
      if (e.key === "Enter") {
