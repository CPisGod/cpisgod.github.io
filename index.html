<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>메모장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main: #f5f5f0;
      --bg-editor: #fffffe;
      --bg-preview: #fafaf8;
      --text-main: #222;
      --border-main: #333;
      --border-light: #ddd;
      --gutter-bg: #f0f0ec;
      --placeholder: #ccc;
    }
    html.dark {
      --bg-main: #1c1c1c;
      --bg-editor: #242424;
      --bg-preview: #202020;
      --text-main: #e0e0e0;
      --border-main: #999;
      --border-light: #3a3a3a;
      --gutter-bg: #2a2a2a;
      --placeholder: #555;
    }

    body {
      background: var(--bg-main);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.2s;
    }

    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #222;
      color: #ddd;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar-header {
      padding: 16px 14px 10px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
    }
    #new-btn {
      margin: 10px 10px 4px;
      background: #444;
      color: #eee;
      border: none;
      padding: 7px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #new-btn:hover { background: #555; }
    #split-toggle {
      margin: 4px 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #split-toggle:hover { background: #333; color: #bbb; }
    #split-toggle.on { background: #3a3a3a; color: #eee; border-color: #555; }
    #theme-toggle {
      margin: 0 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #theme-toggle:hover { background: #333; color: #bbb; }

    #memo-list { flex: 1; overflow-y: auto; min-height: 60px; }
    #doc-header {
      padding: 8px 14px 6px; font-size: 10px; letter-spacing: 2px; color: #777;
      border-top: 1px solid #333; border-bottom: 1px solid #2e2e2e;
    }
    #doc-list { max-height: 28vh; overflow-y: auto; }
    #usage { padding: 8px 14px 4px; font-size: 10px; color: #888; border-top: 1px solid #2a2a2a; }
    #usage .u-row { display: flex; justify-content: space-between; margin-top: 4px; }
    #usage .u-bar { height: 3px; background: #333; margin-top: 2px; }
    #usage .u-fill { height: 100%; background: #5a9a5a; }
    #usage .u-fill.warn { background: #d9a441; }
    #usage .u-fill.over { background: #e03131; }
    .doc-item.active { background: #3a2d2d; color: #bc8f8f; }
    .memo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid #2e2e2e;
      font-size: 12px;
      color: #bbb;
    }
    .memo-item:hover { background: #2a2a2a; }
    .memo-item.active-main { background: #2d3a2d; color: #8fbc8f; }
    .memo-item.active-sub  { background: #2d2d3a; color: #8f8fbc; }
    .memo-item.active-both { background: #3a3a2d; color: #bcbc8f; }
    .memo-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 15px;
      cursor: pointer;
      padding: 0 0 0 6px;
    }
    .delete-btn:hover { color: #f55; }
    #status {
      padding: 8px 14px;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #2a2a2a;
      min-height: 30px;
    }

    #panels {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .panel + .panel { border-left: 3px solid #bbb; }

    .divider {
      width: 4px;
      background: #ccc;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      z-index: 10;
    }
    .divider:hover, .divider.dragging { background: #888; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-main);
      flex-shrink: 0;
    }
    .panel-title-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #aaa;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
      outline: none;
      padding: 3px 0;
      min-width: 0;
    }
    .panel-title-input:focus { border-bottom-color: #000; }
    .panel-title-input::placeholder { color: var(--placeholder); }
    .save-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 7px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .save-btn:hover { background: #000; }
    .save-btn:disabled { background: #aaa; cursor: default; }

    .panel:nth-child(1) .panel-header { border-top: 3px solid #5a9a5a; }
    .panel:nth-child(3) .panel-header { border-top: 3px solid #5a5a9a; }

    .editor-wrap {
      flex: 1;
      display: flex;
      background: var(--bg-editor);
      overflow: hidden;
      position: relative;
    }

    .gutter {
      width: 28px;
      min-width: 28px;
      background: var(--gutter-bg);
      border-right: 1px solid var(--border-light);
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    /* 거터 내부 절대 위치 컨테이너 */
    .gutter-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .gutter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
    }
    .gutter-row:hover .pin-dot:not(.on) { opacity: 0.3; }
    .pin-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e03131;
      opacity: 0;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }
    .pin-dot.on { opacity: 1; }

    .memo-editor {
      flex: 1;
      padding: 18px 20px;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: text;
    }
    .memo-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--placeholder);
      pointer-events: none;
    }
    .memo-editor p {
      line-height: 2.0;
      margin: 0;
      min-height: 1.2em;
    }

    .panel-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      font-size: 11px;
      color: #aaa;
      background: var(--bg-main);
      border-top: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .selcount:empty { display: none; }

    .memo-editor.font-consolas,
    .memo-editor.font-consolas p {
      font-family: 'Consolas', 'D2Coding', monospace;
    }

    /* ── 문서 뷰어 (PDF / DOCX / HWPX) ── */
    .doc-btn {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      padding: 6px 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .doc-btn:hover { background: var(--gutter-bg); }
    .panel.doc-open .editor-wrap,
    .panel.doc-open .panel-bottom { display: none; }
    .panel.drag-over { outline: 3px dashed #5a9a5a; outline-offset: -3px; }
    .doc-view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-preview);
      min-height: 0;
    }
    .panel.doc-open .doc-view { display: flex; }
    .doc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 16px;
      font-size: 12px;
      background: var(--bg-main);
      color: var(--text-main);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-close {
      background: #333; color: #fff; border: none;
      padding: 4px 12px; font-size: 12px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0;
    }
    .doc-close:hover { background: #000; }
    .doc-body { flex: 1; overflow: auto; padding: 16px; }
    .doc-msg { color: #888; font-size: 13px; padding: 20px; text-align: center; }
    .doc-pdf canvas {
      display: block; max-width: 100%; height: auto !important;
      margin: 0 auto 12px; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .doc-page {
      background: #fff; color: #222;
      max-width: 820px; margin: 0 auto; padding: 32px 36px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      font-family: 'Noto Serif KR', serif; font-size: 15px; line-height: 1.8;
      word-break: break-word; overflow-x: auto;
    }
    .doc-page p { min-height: 1.2em; margin: 0 0 .3em; }
    .doc-page img { max-width: 100%; height: auto; }
    .doc-page table { border-collapse: collapse; margin: 8px 0; max-width: 100%; }
    .doc-page td, .doc-page th { border: 1px solid #999; padding: 4px 8px; vertical-align: top; }
    .doc-page h1, .doc-page h2, .doc-page h3 { margin: .8em 0 .4em; }
    .doc-page ul, .doc-page ol { margin: .4em 0 .4em 1.6em; }

    /* ── 모바일 최적화 ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      #sidebar {
        width: 100%;
        min-width: 0;
        height: auto;
        max-height: 40vh;
        flex-direction: column;
        border-bottom: 2px solid #000;
      }

      /* 햄버거 토글 버튼 (사이드바 접기) */
      #sidebar.collapsed {
        max-height: 46px;
        overflow: hidden;
      }

      #sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        cursor: pointer;
      }

      #mobile-toggle-icon {
        font-size: 14px;
        transition: transform 0.2s;
      }
      #sidebar.collapsed #mobile-toggle-icon {
        transform: rotate(-90deg);
      }

      #new-btn, #split-toggle, #theme-toggle, #logout-btn {
        margin: 6px 10px;
        padding: 10px 0;
        font-size: 13px;
      }

      #memo-list {
        max-height: 30vh;
      }

      .memo-item {
        padding: 12px 14px;
        font-size: 14px;
      }

      #panels { flex-direction: column; }

      .panel-header {
        padding: 10px 12px 8px;
      }
      .panel-title-input { font-size: 16px; }
      .save-btn { padding: 8px 14px; font-size: 13px; }

      .memo-editor { padding: 14px 16px; font-size: 15px; }

      .gutter { width: 22px; min-width: 22px; }
      .pin-dot { width: 9px; height: 9px; }

      /* 분할 모드는 모바일에서 세로로 전환 */
      .panel + .panel { border-left: none; border-top: 3px solid #bbb; }
      .divider { display: none !important; }
    }
  </style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="lock-screen" style="
  position: fixed; inset: 0;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 16px;
">
  <div style="color: #777; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-family: 'Noto Sans KR', sans-serif;">MEMOS</div>
  <input id="email-input" type="email" placeholder="이메일" autocomplete="username" style="
    background: #2a2a2a;
    border: 1px solid #444;
    color: #eee;
    padding: 10px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    width: 220px;
    text-align: center;
  " />
  <input id="pw-input" type="password" placeholder="비밀번호" autocomplete="current-password" style="
    background: #2a2a2a;
    border: 1px solid #444;
    color: #eee;
    padding: 10px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    width: 220px;
    text-align: center;
  " />
  <div id="pw-error" style="color: #e03131; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; height: 16px;"></div>
</div>

<div id="sidebar">
  <div id="sidebar-header">MEMOS <span id="mobile-toggle-icon">▾</span></div>
  <button id="new-btn">+ 새 메모</button>
  <button id="split-toggle">⊟ 분할화면</button>
  <button id="theme-toggle">🌙 다크모드</button>
  <button id="logout-btn" style="margin:0 10px 10px;background:#2a2a2a;color:#888;border:1px solid #3a3a3a;padding:6px 0;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;width:calc(100% - 20px);">로그아웃</button>
  <div id="memo-list"></div>
  <div id="doc-header">DOCS</div>
  <div id="doc-list"></div>
  <div id="usage"></div>
  <div id="status">🔒 로그인 필요</div>
</div>

<div id="panels"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, push, update, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getStorage, ref as sRef, uploadBytesResumable, getBytes, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDgjizBR_P_ccjZczxcvCLmVuUi2wKIQYU",
    authDomain:        "memo-acd0e.firebaseapp.com",
    databaseURL:       "https://memo-acd0e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "memo-acd0e",
    storageBucket:     "memo-acd0e.firebasestorage.app",
    messagingSenderId: "116520806995",
    appId:             "1:116520806995:web:abbafb950052296db8b4a6",
    measurementId:     "G-9H3GX7SWKG"
  };

  const app = initializeApp(firebaseConfig);

  // ── 로그인 (Firebase Auth 이메일/비밀번호) ──
  const lockScreen = document.getElementById("lock-screen");
  const emailInput = document.getElementById("email-input");
  const pwInput    = document.getElementById("pw-input");
  const pwError    = document.getElementById("pw-error");
  const auth       = getAuth(app);

  function showLoginError(msg) {
    pwError.textContent = msg;
    setTimeout(() => { pwError.textContent = ""; }, 3000);
  }
  async function doLogin() {
    const email = emailInput.value.trim(), pw = pwInput.value;
    if (!email || !pw) return;
    pwError.textContent = "로그인 중...";
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      pwInput.value = "";
    } catch (e) {
      pwInput.value = "";
      showLoginError(e.code === "auth/too-many-requests"
        ? "시도가 너무 많습니다. 잠시 후 다시 시도하세요."
        : "이메일 또는 비밀번호가 틀렸습니다.");
    }
  }
  [emailInput, pwInput].forEach(el => el.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }));
  setTimeout(() => emailInput.focus(), 100);

  // ── 모바일 사이드바 접기/펼치기 ──
  const sidebarHeader = document.getElementById("sidebar-header");
  const sidebarEl     = document.getElementById("sidebar");
  sidebarHeader.addEventListener("click", () => {
    if (window.innerWidth <= 768) {
      sidebarEl.classList.toggle("collapsed");
    }
  });

  // ── 다크모드 토글 (세션 중에만 유지) ──
  const themeToggle = document.getElementById("theme-toggle");
  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    themeToggle.textContent = dark ? "☀️ 라이트모드" : "🌙 다크모드";
  }
  themeToggle.addEventListener("click", () => {
    applyTheme(!document.documentElement.classList.contains("dark"));
  });

  const db       = getDatabase(app);
  const memosRef = ref(db, "memos");
  const docsRef  = ref(db, "docs");
  const storage  = getStorage(app);

  const panelsEl    = document.getElementById("panels");
  const memoListEl  = document.getElementById("memo-list");
  const statusEl    = document.getElementById("status");
  const newBtn      = document.getElementById("new-btn");
  const splitToggle = document.getElementById("split-toggle");
  const docListEl   = document.getElementById("doc-list");
  const usageEl     = document.getElementById("usage");

  let memos   = {};
  let docs    = {};          // RTDB에 저장된 문서 메타 { id: {name, path, size} }
  const localDocs = {};      // 업로드 실패 시 이번 세션에서만 볼 수 있는 임시 문서
  const docCache  = new Map(); // id -> ArrayBuffer (재다운로드 방지)
  const getDoc = (id) => docs[id] || localDocs[id];
  let splitOn = false;
  let pins    = {};  // { memoId: Set<paraIdx> }
  let panels  = [];

  function getPins(id) {
    if (!pins[id]) pins[id] = new Set();
    return pins[id];
  }

  function textToHtml(text) {
    if (!text) return "<p><br></p>";
    return text.split("\n").map(l => `<p>${l ? esc(l) : "<br>"}</p>`).join("");
  }
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function htmlToText(el) {
    return Array.from(el.querySelectorAll("p")).map(p =>
      (p.innerHTML === "<br>" || p.innerHTML === "") ? "" : p.innerText
    ).join("\n");
  }

  // ── 거터 렌더링 ──
  // 각 <p>의 offsetTop, offsetHeight를 그대로 반영해서 정확히 맞춤
  function renderGutter(panelIdx) {
    const p = panels[panelIdx];
    if (!p || !p.gutterEl || !p.editorEl) return;

    const pinSet    = p.memoId ? getPins(p.memoId) : new Set();
    const paras     = p.editorEl.querySelectorAll("p");
    const inner     = p.gutterEl.querySelector(".gutter-inner");
    if (!inner) return;
    inner.innerHTML = "";

    // 에디터 padding-top (18px)
    const editorPaddingTop = parseFloat(getComputedStyle(p.editorEl).paddingTop) || 0;

    paras.forEach((para, i) => {
      const row = document.createElement("div");
      row.className = "gutter-row";
      // <p>의 에디터 내 위치와 높이를 그대로 사용
      row.style.position = "absolute";
      row.style.top      = (para.offsetTop + editorPaddingTop - editorPaddingTop) + "px";
      row.style.height   = para.offsetHeight + "px";
      row.style.width    = "100%";

      const dot = document.createElement("div");
      dot.className = "pin-dot" + (pinSet.has(i) ? " on" : "");

      row.addEventListener("click", () => {
        pinSet.has(i) ? pinSet.delete(i) : pinSet.add(i);
        dot.classList.toggle("on");
      });

      row.appendChild(dot);
      inner.appendChild(row);
    });

    // inner 높이를 에디터 scrollHeight에 맞춤
    inner.style.height = p.editorEl.scrollHeight + "px";
  }

  // ── 패널 DOM 생성 ──
  function createPanelEl(panelIdx) {
    const wrap = document.createElement("div");
    wrap.className = "panel";

    wrap.innerHTML = `
      <div class="panel-header">
        <input class="panel-title-input" type="text" placeholder="제목 없음" maxlength="80" />
        <button class="doc-btn" title="PDF / DOCX / HWPX 문서 열기">📄 문서</button>
        <input class="doc-file" type="file" accept=".pdf,.docx,.hwpx" hidden />
        <button class="save-btn">저장</button>
      </div>
      <div class="doc-view">
        <div class="doc-bar"><span class="doc-name"></span><button class="doc-close">✕ 닫고 메모로</button></div>
        <div class="doc-body"></div>
      </div>
      <div class="editor-wrap">
        <div class="gutter"><div class="gutter-inner"></div></div>
        <div class="memo-editor" contenteditable="true" spellcheck="false"
             data-placeholder="메모를 선택하세요..."></div>
      </div>
      <div class="panel-bottom"><span class="selcount"></span><span class="charcount">0자</span></div>
    `;

    const titleInput = wrap.querySelector(".panel-title-input");
    const saveBtn    = wrap.querySelector(".save-btn");
    const gutter     = wrap.querySelector(".gutter");
    const editor     = wrap.querySelector(".memo-editor");
    const charcount  = wrap.querySelector(".charcount");
    const selcount   = wrap.querySelector(".selcount");

    const pState = { memoId: null, editorEl: editor, titleEl: titleInput, gutterEl: gutter, selCountEl: selcount, dirty: false,
                     panelEl: wrap, docId: null, docToken: 0 };
    panels[panelIdx] = pState;

    // 문서 열기: 버튼 / 드래그앤드롭
    const docBtn   = wrap.querySelector(".doc-btn");
    const docInput = wrap.querySelector(".doc-file");
    docBtn.addEventListener("click", () => docInput.click());
    docInput.addEventListener("change", () => {
      if (docInput.files[0]) openLocalFile(panelIdx, docInput.files[0]);
      docInput.value = "";
    });
    wrap.querySelector(".doc-close").addEventListener("click", () => closeDoc(panelIdx));
    wrap.addEventListener("dragover", (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) {
        e.preventDefault();
        wrap.classList.add("drag-over");
      }
    });
    wrap.addEventListener("dragleave", (e) => {
      if (!wrap.contains(e.relatedTarget)) wrap.classList.remove("drag-over");
    });
    wrap.addEventListener("drop", (e) => {
      wrap.classList.remove("drag-over");
      const f = e.dataTransfer && e.dataTransfer.files[0];
      if (!f) return;
      e.preventDefault();
      openLocalFile(panelIdx, f);
    });

    saveBtn.addEventListener("click", () => savePanel(panelIdx));

    titleInput.addEventListener("input", () => { pState.dirty = true; });

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.execCommand("insertParagraph");
        requestAnimationFrame(() => renderGutter(panelIdx));
      }
    });

    editor.addEventListener("input", () => {
      charcount.textContent = htmlToText(editor).length + "자";
      pState.dirty = true;
      requestAnimationFrame(() => renderGutter(panelIdx));
    });

    // 스크롤 동기화: gutter-inner를 translateY로 에디터 스크롤에 맞춤
    editor.addEventListener("scroll", () => {
      const inner = gutter.querySelector(".gutter-inner");
      if (inner) inner.style.transform = `translateY(-${editor.scrollTop}px)`;
    });

    // 붙여넣기 시 서식 제거 → 순수 텍스트만
    editor.addEventListener("paste", (e) => {
      e.preventDefault();
      // 메모장(Windows) 등에서 복사한 텍스트는 줄바꿈이 \r\n으로 되어 있어
      // \r과 \n이 각각 개행으로 처리되면서 엔터가 중복되는 문제가 있어 정규화한다.
      const text = e.clipboardData.getData("text/plain").replace(/\r\n?/g, "\n");
      document.execCommand("insertText", false, text);
      requestAnimationFrame(() => renderGutter(panelIdx));
    });

    const ro = new ResizeObserver(() => requestAnimationFrame(() => renderGutter(panelIdx)));
    ro.observe(editor);

    return wrap;
  }

  // ── 문서 뷰어 (PDF / DOCX / HWPX) ──
  // 라이브러리는 문서를 처음 열 때 한 번만 지연 로드한다.
  const libCache = {};
  function loadScript(src) {
    if (!libCache[src]) {
      libCache[src] = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => { delete libCache[src]; reject(new Error("라이브러리 로드 실패: " + src)); };
        document.head.appendChild(s);
      });
    }
    return libCache[src];
  }
  const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
  const PDFJS_BASE = CDN + "pdf.js/3.11.174/";

  async function renderPdf(buf, body) {
    await loadScript(PDFJS_BASE + "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const wrap = document.createElement("div");
    wrap.className = "doc-pdf";
    body.innerHTML = "";
    body.appendChild(wrap);
    const targetW = Math.max(body.clientWidth - 32, 400);
    const dpr = window.devicePixelRatio || 1;
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (targetW / base.width) * dpr });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = (vp.width / dpr) + "px";
      wrap.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    }
  }

  async function renderDocx(buf, body) {
    await loadScript(CDN + "mammoth/1.6.0/mammoth.browser.min.js");
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    body.innerHTML = '<div class="doc-page"></div>';
    body.firstChild.innerHTML = result.value || '<p class="doc-msg">내용이 없습니다.</p>';
  }

  // HWPX = ZIP + XML. 문단(p), 표(tbl), 줄바꿈만 추출해 간이 렌더링한다. (이미지/도형은 제외)
  async function renderHwpx(buf, body) {
    await loadScript(CDN + "jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(buf);
    const names = Object.keys(zip.files)
      .filter(n => /^Contents\/section\d+\.xml$/i.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10));
    if (!names.length) throw new Error("HWPX 본문(section)을 찾을 수 없습니다.");

    const page = document.createElement("div");
    page.className = "doc-page";
    const kids = (el, name) => Array.from(el.children).filter(c => c.localName === name);

    function walkP(pEl, out) {
      let p = document.createElement("p");
      out.appendChild(p);
      (function rec(n) {
        for (const c of n.children) {
          const ln = c.localName;
          if (ln === "t") p.appendChild(document.createTextNode(c.textContent));
          else if (ln === "tbl") { out.appendChild(buildTbl(c)); p = document.createElement("p"); out.appendChild(p); }
          else if (ln === "lineBreak") p.appendChild(document.createElement("br"));
          else if (ln === "tab") p.appendChild(document.createTextNode("\u2003"));
          else if (ln === "header" || ln === "footer") continue;
          else rec(c);
        }
      })(pEl);
    }
    function buildTbl(tbl) {
      const table = document.createElement("table");
      for (const tr of kids(tbl, "tr")) {
        const row = table.insertRow();
        for (const tc of kids(tr, "tc")) {
          const td = row.insertCell();
          const span = kids(tc, "cellSpan")[0];
          if (span) {
            const cs = parseInt(span.getAttribute("colSpan"), 10), rs = parseInt(span.getAttribute("rowSpan"), 10);
            if (cs > 1) td.colSpan = cs;
            if (rs > 1) td.rowSpan = rs;
          }
          const sub = kids(tc, "subList")[0];
          if (sub) kids(sub, "p").forEach(p => walkP(p, td));
        }
      }
      return table;
    }

    for (const name of names) {
      const xml = new DOMParser().parseFromString(await zip.file(name).async("string"), "application/xml");
      if (xml.querySelector("parsererror")) throw new Error("HWPX XML 해석 실패");
      kids(xml.documentElement, "p").forEach(p => walkP(p, page));
    }
    body.innerHTML = "";
    body.appendChild(page);
  }

  let synced = false;

  // ── 사용량 표시 (무료 한도: 저장 5GB / 일 다운로드 1GB) ──
  const LIMIT_DOWN = 1 * 1024 ** 3;   // 하루 다운로드
  const LIMIT_STORE = 5 * 1024 ** 3;  // 총 저장
  let usageToday = 0;                 // 오늘 이 앱이 내려받은 바이트
  let usageDay = null, usageUnsub = null;
  // Storage 일일 할당량은 태평양시 자정 기준으로 초기화된다.
  const dayKey = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
  const fmtBytes = (n) => n >= 1024 ** 3 ? (n / 1024 ** 3).toFixed(2) + "GB"
                        : n >= 1024 ** 2 ? (n / 1024 ** 2).toFixed(1) + "MB"
                        : Math.ceil(n / 1024) + "KB";

  function renderUsage() {
    const stored = Object.values(docs).reduce((a, d) => a + (d.size || 0), 0);
    const row = (label, used, limit) => {
      const pct = Math.min(used / limit * 100, 100);
      const cls = used >= limit ? "over" : used >= limit * 0.8 ? "warn" : "";
      return `<div class="u-row"><span>${label}</span><span>${fmtBytes(used)} / ${fmtBytes(limit)}</span></div>
              <div class="u-bar"><div class="u-fill ${cls}" style="width:${pct}%"></div></div>`;
    };
    usageEl.innerHTML = row("오늘 다운로드", usageToday, LIMIT_DOWN) + row("저장 용량", stored, LIMIT_STORE);
  }
  function subscribeUsage() {
    const day = dayKey();
    if (day === usageDay) return;
    if (usageUnsub) usageUnsub();
    usageDay = day;
    usageToday = 0;
    usageUnsub = onValue(ref(db, `usage/${day}`), (snap) => {
      usageToday = (snap.val() && snap.val().down) || 0;
      renderUsage();
    });
    renderUsage();
  }
  setInterval(() => { if (synced) subscribeUsage(); }, 60000);  // 날짜가 바뀌면 새 날짜로 전환
  function addDownloadUsage(bytes) {
    usageToday += bytes;
    renderUsage();
    update(ref(db, `usage/${dayKey()}`), { down: increment(bytes) }).catch(() => {});
  }

  // 한 번 받은 문서는 브라우저 Cache API에 보관해 새로고침 때 재다운로드(=한도 소모)를 막는다.
  async function cacheGet(id) {
    try { const r = await (await caches.open("docs-v1")).match("/__doc/" + id); return r ? await r.arrayBuffer() : null; }
    catch (e) { return null; }
  }
  async function cachePut(id, buf) {
    try { await (await caches.open("docs-v1")).put("/__doc/" + id, new Response(buf.slice(0))); } catch (e) {}
  }
  async function cacheDelete(id) {
    try { await (await caches.open("docs-v1")).delete("/__doc/" + id); } catch (e) {}
  }
  async function loadDocBuffer(id, d) {
    let buf = docCache.get(id) || await cacheGet(id);
    if (!buf) {
      if (usageToday + (d.size || 0) > LIMIT_DOWN &&
          !confirm(`오늘 다운로드가 무료 한도(1GB)를 넘을 수 있습니다. (현재 ${fmtBytes(usageToday)})\n그래도 불러올까요?`))
        throw new Error("다운로드 한도 확인에서 취소됨");
      buf = await getBytes(sRef(storage, d.path));
      addDownloadUsage(buf.byteLength);
      cachePut(id, buf);
    }
    docCache.set(id, buf);
    return buf;
  }

  const DOC_RENDERERS = { pdf: renderPdf, docx: renderDocx, hwpx: renderHwpx };
  const extOf = (name) => (name.split(".").pop() || "").toLowerCase();

  // 어떤 패널에 어떤 문서가 열려 있는지 기억 → 새로고침 후 복원
  function saveDocState() {
    try {
      localStorage.setItem("panelDocs", JSON.stringify({
        split: splitOn,
        ids: [panels[0] && panels[0].docId || null, panels[1] && panels[1].docId || null]
      }));
    } catch (e) {}
  }

  // 로컬 파일 선택/드롭 → Storage 업로드 → 패널에 표시
  async function openLocalFile(panelIdx, file) {
    const ext = extOf(file.name);
    if (!DOC_RENDERERS[ext]) {
      alert(ext === "hwp" || ext === "doc"
        ? `.${ext} (구형 바이너리 포맷)은 지원하지 않습니다. ${ext === "hwp" ? "한글에서 .hwpx" : "Word에서 .docx"}로 저장 후 열어주세요.`
        : "PDF, DOCX, HWPX 파일만 열 수 있습니다.");
      return;
    }
    const buf = await file.arrayBuffer();
    const path = `docs/${Date.now()}_${file.name.replace(/[^\w.\-가-힣]+/g, "_")}`;
    try {
      const task = uploadBytesResumable(sRef(storage, path), buf, { contentType: file.type || undefined });
      task.on("state_changed", (snap) => {
        statusEl.textContent = `⬆️ 업로드 ${Math.round(snap.bytesTransferred / snap.totalBytes * 100)}% · ${file.name}`;
      });
      await task;
      const newRef = push(docsRef);
      await set(newRef, { name: file.name, path, size: file.size, ts: Date.now() });
      docCache.set(newRef.key, buf);
      cachePut(newRef.key, buf);
      docs[newRef.key] = { name: file.name, path, size: file.size };  // onValue 도착 전에도 바로 열 수 있게
      statusEl.textContent = "✅ 문서 저장됨 " + new Date().toLocaleTimeString();
      openDoc(panelIdx, newRef.key);
    } catch (e) {
      statusEl.textContent = "❌ 업로드 실패(이번 세션에서만 보임): " + e.message;
      const tmpId = "local_" + Date.now();
      localDocs[tmpId] = { name: file.name, local: true };
      docCache.set(tmpId, buf);
      openDoc(panelIdx, tmpId);
    }
  }

  async function openDoc(panelIdx, docId) {
    const p = panels[panelIdx];
    const d = getDoc(docId);
    if (!p || !d) return;
    const renderer = DOC_RENDERERS[extOf(d.name)];
    if (!renderer) return;
    const token = ++p.docToken;
    p.docId = docId;
    p.panelEl.classList.add("doc-open");
    p.panelEl.querySelector(".doc-name").textContent = "📄 " + d.name;
    const body = p.panelEl.querySelector(".doc-body");
    body.innerHTML = '<div class="doc-msg">⏳ 문서를 불러오는 중...</div>';
    saveDocState();
    renderDocList();
    try {
      const buf = await loadDocBuffer(docId, d);
      if (token !== p.docToken) return;  // 그 사이 다른 문서를 열었거나 닫힘
      await renderer(buf.slice(0), body);
    } catch (e) {
      if (token !== p.docToken) return;
      body.innerHTML = "";
      const msg = document.createElement("div");
      msg.className = "doc-msg";
      msg.textContent = "❌ 문서를 열 수 없습니다: " + e.message;
      body.appendChild(msg);
    }
  }

  function closeDoc(panelIdx) {
    const p = panels[panelIdx];
    if (!p) return;
    p.docToken++;
    p.docId = null;
    p.panelEl.classList.remove("doc-open");
    p.panelEl.querySelector(".doc-body").innerHTML = "";
    saveDocState();
    renderDocList();
    requestAnimationFrame(() => renderGutter(panelIdx));
  }

  function sidebarClickDoc(docId) {
    if (!splitOn) openDoc(0, docId);
    else if (panels[0] && panels[0].docId === docId) openDoc(1, docId);
    else openDoc(0, docId);
  }

  async function deleteDoc(id) {
    const d = getDoc(id);
    if (!d || !confirm(`"${d.name}" 문서를 삭제할까요?`)) return;
    panels.forEach((p, i) => { if (p && p.docId === id) closeDoc(i); });
    docCache.delete(id);
    cacheDelete(id);
    if (d.local) { delete localDocs[id]; renderDocList(); return; }
    try { await deleteObject(sRef(storage, d.path)); } catch (e) {}
    remove(ref(db, `docs/${id}`));
  }

  function renderDocList() {
    docListEl.innerHTML = "";
    const all = { ...docs, ...localDocs };
    const ids = Object.keys(all);
    if (!ids.length) {
      docListEl.innerHTML = '<div style="padding:10px 14px;color:#555;font-size:11px;">문서 없음</div>';
      return;
    }
    const open = panels.map(p => p && p.docId);
    ids.forEach(id => {
      const item = document.createElement("div");
      item.className = "memo-item doc-item" + (open.includes(id) ? " active" : "");
      const t = document.createElement("span");
      t.className = "memo-item-title";
      t.textContent = (all[id].local ? "⚠️ " : "📄 ") + all[id].name;
      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "×";
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteDoc(id); });
      item.appendChild(t);
      item.appendChild(del);
      item.addEventListener("click", () => sidebarClickDoc(id));
      docListEl.appendChild(item);
    });
  }

  function loadMemoInPanel(panelIdx, memoId) {
    const p = panels[panelIdx];
    if (!p) return;
    p.memoId = memoId;
    const m = memos[memoId] || {};
    p.titleEl.value      = m.title   || "";
    p.editorEl.innerHTML = textToHtml(m.content || "");
    p.editorEl.setAttribute("data-placeholder", "여기에 메모를 입력하세요...");
    p.dirty = false;
    const panelEl = panelsEl.children[splitOn ? panelIdx * 2 : 0];
    const charcountEl = panelEl ? panelEl.querySelector(".charcount") : null;
    if (charcountEl) charcountEl.textContent = htmlToText(p.editorEl).length + "자";
    // pins 로드
    const savedPins = m.pins ? new Set(m.pins) : new Set();
    pins[memoId] = savedPins;
    requestAnimationFrame(() => renderGutter(panelIdx));
    renderList();
  }

  function savePanel(panelIdx, isAuto = false) {
    const p = panels[panelIdx];
    if (!p || !p.memoId) return;
    const panelEl = panelsEl.children[splitOn ? panelIdx * 2 : 0];
    const saveBtn = panelEl ? panelEl.querySelector(".save-btn") : null;
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "저장 중..."; }
    const title   = p.titleEl.value.trim() || "제목 없음";
    const content = htmlToText(p.editorEl);
    const pinArr  = p.memoId && pins[p.memoId] ? Array.from(pins[p.memoId]) : [];
    set(ref(db, `memos/${p.memoId}`), { title, content, pins: pinArr })
      .then(() => {
        p.dirty = false;
        statusEl.textContent = (isAuto ? "💾 자동저장 " : "✅ ") + new Date().toLocaleTimeString();
        if (saveBtn) { saveBtn.textContent = "저장"; saveBtn.disabled = false; }
      })
      .catch((e) => {
        statusEl.textContent = "❌ " + e.message;
        if (saveBtn) { saveBtn.textContent = "저장"; saveBtn.disabled = false; }
      });
  }

  // ── 1분마다 자동저장 (변경된 패널만) ──
  setInterval(() => {
    panels.forEach((p, i) => {
      if (p && p.memoId && p.dirty) savePanel(i, true);
    });
  }, 60000);

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      panels.forEach((p, i) => {
        if (p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl))
          savePanel(i);
      });
      const anyFocused = panels.some(p => p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl));
      if (!anyFocused && panels[0] && panels[0].memoId) savePanel(0);
    }

    // Ctrl(Cmd) + Alt + C: 포커스된 에디터 글꼴 Consolas 전환/해제
    if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === "c") {
      e.preventDefault();
      let target = panels.find(p => p && document.activeElement === p.editorEl);
      if (!target) target = panels[0];
      if (target && target.editorEl) target.editorEl.classList.toggle("font-consolas");
    }
  });

  // ── 드래그 선택된 글자수 표시 ──
  function updateSelectionCounts() {
    const sel = (window.getSelection && window.getSelection()) || null;
    panels.forEach((p) => {
      if (!p || !p.selCountEl) return;
      let len = 0;
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const range = sel.getRangeAt(0);
        if (p.editorEl.contains(range.commonAncestorContainer)) {
          len = sel.toString().length;
        }
      }
      p.selCountEl.textContent = len > 0 ? `선택 ${len}자 · ` : "";
    });
  }
  document.addEventListener("selectionchange", updateSelectionCounts);

  function setSplit(on) {
    splitOn = on;
    splitToggle.textContent = splitOn ? "⊞ 분할화면 ON" : "⊟ 분할화면";
    splitToggle.classList.toggle("on", splitOn);
    rebuildPanels();
  }
  splitToggle.addEventListener("click", () => setSplit(!splitOn));

  function rebuildPanels() {
    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    const doc0 = panels[0] ? panels[0].docId : null;
    const doc1 = panels[1] ? panels[1].docId : null;
    panels = [];
    panelsEl.innerHTML = "";

    const p0El = createPanelEl(0);
    panelsEl.appendChild(p0El);

    if (splitOn) {
      const div = document.createElement("div");
      div.className = "divider";
      panelsEl.appendChild(div);

      const p1El = createPanelEl(1);
      panelsEl.appendChild(p1El);

      let dragging = false;
      div.addEventListener("mousedown", (e) => { dragging = true; div.classList.add("dragging"); e.preventDefault(); });
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const rect = panelsEl.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.min(Math.max(pct, 20), 80);
        p0El.style.flex = "none";
        p0El.style.width = pct + "%";
        p1El.style.flex = "1";
      });
      document.addEventListener("mouseup", () => { dragging = false; div.classList.remove("dragging"); });

      if (id1) loadMemoInPanel(1, id1);
    }

    if (id0) loadMemoInPanel(0, id0);
    if (doc0) openDoc(0, doc0);
    if (splitOn && doc1) openDoc(1, doc1);
    renderList();
  }

  function sidebarClickMemo(memoId) {
    if (!splitOn) {
      loadMemoInPanel(0, memoId);
    } else {
      if (panels[0] && panels[0].memoId === memoId) loadMemoInPanel(1, memoId);
      else loadMemoInPanel(0, memoId);
    }
  }

  function renderList() {
    memoListEl.innerHTML = "";
    const ids = Object.keys(memos);
    if (ids.length === 0) {
      memoListEl.innerHTML = '<div style="padding:10px 14px;color:#555;font-size:11px;">메모 없음</div>';
      return;
    }
    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    ids.forEach(id => {
      const m = memos[id];
      const item = document.createElement("div");
      const inMain = id === id0, inSub = id === id1;
      item.className = "memo-item" + (inMain && inSub ? " active-both" : inMain ? " active-main" : inSub ? " active-sub" : "");
      const titleSpan = document.createElement("span");
      titleSpan.className = "memo-item-title";
      titleSpan.textContent = m.title || "제목 없음";
      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "×";
      delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteMemo(id); });
      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      item.addEventListener("click", () => sidebarClickMemo(id));
      memoListEl.appendChild(item);
    });
  }

  newBtn.addEventListener("click", () => {
    const newRef = push(memosRef);
    set(newRef, { title: "새 메모", content: "" }).then(() => loadMemoInPanel(0, newRef.key));
  });

  function deleteMemo(id) {
    if (!confirm("이 메모를 삭제할까요?")) return;
    remove(ref(db, `memos/${id}`));
  }

  const unsubs = [];
  function startSync() {
  unsubs.push(onValue(memosRef, (snapshot) => {
    memos = snapshot.val() || {};
    statusEl.textContent = "✅ 연결됨";
    // 열려있는 패널의 pins 갱신
    panels.forEach((p, i) => {
      if (p && p.memoId && memos[p.memoId]) {
        const m = memos[p.memoId];
        if (m.pins) pins[p.memoId] = new Set(m.pins);
      }
    });
    renderList();
  }, (e) => { statusEl.textContent = "❌ " + e.message; }));
  }

  // ── 문서 목록 구독 + 새로고침 시 열려있던 문서 복원 ──
  let docsRestored = false;
  function startDocSync() {
  unsubs.push(onValue(docsRef, (snapshot) => {
    docs = snapshot.val() || {};
    renderDocList();
    renderUsage();
    if (docsRestored) return;
    docsRestored = true;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("panelDocs")); } catch (e) {}
    if (!saved || !Array.isArray(saved.ids)) return;
    const [id0, id1] = saved.ids.map(id => (id && docs[id]) ? id : null);
    if (saved.split && !splitOn) setSplit(true);
    if (id0) openDoc(0, id0);
    if (splitOn && id1) openDoc(1, id1);
  }, (e) => { statusEl.textContent = "❌ " + e.message; }));
  }

  rebuildPanels();

  // ── 인증 상태에 따라 잠금/구독 ──
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    location.reload();  // 메모리의 데이터까지 깨끗이 비움
  });
  onAuthStateChanged(auth, (user) => {
    if (user) {
      lockScreen.style.display = "none";
      if (!synced) { synced = true; startSync(); startDocSync(); subscribeUsage(); }
    } else {
      lockScreen.style.display = "flex";
      statusEl.textContent = "🔒 로그인 필요";
      emailInput.focus();
    }
  });

</script>
</body>
</html>
