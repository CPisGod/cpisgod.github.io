<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>메모장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main: #f5f5f0;
      --bg-editor: #fffffe;
      --bg-preview: #fafaf8;
      --text-main: #222;
      --border-main: #333;
      --border-light: #ddd;
      --gutter-bg: #f0f0ec;
      --placeholder: #ccc;
    }
    html.dark {
      --bg-main: #1c1c1c;
      --bg-editor: #242424;
      --bg-preview: #202020;
      --text-main: #e0e0e0;
      --border-main: #999;
      --border-light: #3a3a3a;
      --gutter-bg: #2a2a2a;
      --placeholder: #555;
    }

    body {
      background: var(--bg-main);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.2s;
    }

    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #222;
      color: #ddd;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar-header {
      padding: 16px 14px 10px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
    }
    #new-btn {
      margin: 10px 10px 4px;
      background: #444;
      color: #eee;
      border: none;
      padding: 7px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #new-btn:hover { background: #555; }
    #split-toggle {
      margin: 4px 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #split-toggle:hover { background: #333; color: #bbb; }
    #split-toggle.on { background: #3a3a3a; color: #eee; border-color: #555; }
    #theme-toggle {
      margin: 0 10px 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #3a3a3a;
      padding: 6px 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      cursor: pointer;
      width: calc(100% - 20px);
    }
    #theme-toggle:hover { background: #333; color: #bbb; }

    #memo-list { flex: 1; overflow-y: auto; min-height: 60px; }
    #doc-header {
      padding: 8px 14px 6px; font-size: 10px; letter-spacing: 2px; color: #777;
      border-top: 1px solid #333; border-bottom: 1px solid #2e2e2e;
    }
    #doc-list { max-height: 28vh; overflow-y: auto; }
    #usage { padding: 8px 14px 4px; font-size: 10px; color: #888; border-top: 1px solid #2a2a2a; }
    #usage .u-row { display: flex; justify-content: space-between; margin-top: 4px; }
    #usage .u-bar { height: 3px; background: #333; margin-top: 2px; }
    #usage .u-fill { height: 100%; background: #5a9a5a; }
    #usage .u-fill.warn { background: #d9a441; }
    #usage .u-fill.over { background: #e03131; }
    .doc-item.active { background: #3a2d2d; color: #bc8f8f; }
    .memo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid #2e2e2e;
      font-size: 12px;
      color: #bbb;
    }
    .memo-item:hover { background: #2a2a2a; }
    .memo-item.active-main { background: #2d3a2d; color: #8fbc8f; }
    .memo-item.active-sub  { background: #2d2d3a; color: #8f8fbc; }
    .memo-item.active-both { background: #3a3a2d; color: #bcbc8f; }
    .memo-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 15px;
      cursor: pointer;
      padding: 0 0 0 6px;
    }
    .delete-btn:hover { color: #f55; }
    #status {
      padding: 8px 14px;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #2a2a2a;
      min-height: 30px;
    }

    #panels {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .panel + .panel { border-left: 3px solid #bbb; }

    .divider {
      width: 4px;
      background: #ccc;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      z-index: 10;
    }
    .divider:hover, .divider.dragging { background: #888; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-main);
      flex-shrink: 0;
    }
    .panel-title-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #aaa;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
      outline: none;
      padding: 3px 0;
      min-width: 0;
    }
    .panel-title-input:focus { border-bottom-color: #000; }
    .panel-title-input::placeholder { color: var(--placeholder); }
    .save-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 7px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .save-btn:hover { background: #000; }
    .save-btn:disabled { background: #aaa; cursor: default; }

    .panel:nth-child(1) .panel-header { border-top: 3px solid #5a9a5a; }
    .panel:nth-child(3) .panel-header { border-top: 3px solid #5a5a9a; }

    .editor-wrap {
      flex: 1;
      display: flex;
      background: var(--bg-editor);
      overflow: hidden;
      position: relative;
    }

    .gutter {
      width: 28px;
      min-width: 28px;
      background: var(--gutter-bg);
      border-right: 1px solid var(--border-light);
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    /* 거터 내부 절대 위치 컨테이너 */
    .gutter-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .gutter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
    }
    .gutter-row:hover .pin-dot:not(.on) { opacity: 0.3; }
    .pin-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e03131;
      opacity: 0;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }
    .pin-dot.on { opacity: 1; }

    .memo-editor {
      flex: 1;
      padding: 18px 20px;
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
      white-space: pre-wrap;
      cursor: text;
    }
    .memo-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--placeholder);
      pointer-events: none;
    }
    .memo-editor p {
      line-height: 2.0;
      margin: 0;
      min-height: 1.2em;
    }

    .panel-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 5px 16px;
      font-size: 11px;
      color: #aaa;
      background: var(--bg-main);
      border-top: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .selcount:empty { display: none; }

    .memo-editor.font-consolas,
    .memo-editor.font-consolas p {
      font-family: 'Consolas', 'D2Coding', monospace;
    }

    /* ── 문서 뷰어 (PDF / DOCX / HWPX) ── */
    .doc-btn {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      padding: 6px 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .doc-btn:hover { background: var(--gutter-bg); }
    .panel.doc-open .editor-wrap,
    .panel.doc-open .panel-bottom { display: none; }
    .panel.drag-over { outline: 3px dashed #5a9a5a; outline-offset: -3px; }
    .doc-view {
      position: relative;
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-preview);
      min-height: 0;
    }
    .panel.doc-open .doc-view { display: flex; }
    .doc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 16px;
      font-size: 12px;
      background: var(--bg-main);
      color: var(--text-main);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .doc-bar { flex-wrap: wrap; }
    .doc-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
    .pdf-nav, .zoom-ctl { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
    .pdf-nav[hidden], .zoom-ctl[hidden], .find-btn[hidden], .rect-btn[hidden], .find-bar[hidden] { display: none; }
    .pdf-nav button, .zoom-ctl button, .find-btn, .rect-btn, .find-bar button {
      background: transparent; color: var(--text-main); border: 1px solid var(--border-light);
      padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .pdf-nav button:hover, .zoom-ctl button:hover, .find-btn:hover, .rect-btn:hover, .find-bar button:hover { background: var(--gutter-bg); }
    .rect-btn.on { background: #e8590c; color: #fff; border-color: #e8590c; }
    .pg-input { width: 46px; text-align: center; font-size: 12px; padding: 2px; background: var(--bg-editor); color: var(--text-main); border: 1px solid var(--border-light); }
    .zoom-val { min-width: 38px; text-align: center; }
    .find-bar {
      display: flex; align-items: center; gap: 6px; padding: 5px 16px; flex-shrink: 0;
      background: var(--bg-main); border-bottom: 1px solid var(--border-light); font-size: 12px; color: var(--text-main);
    }
    .find-input { flex: 1; max-width: 260px; padding: 4px 8px; font-size: 12px; background: var(--bg-editor); color: var(--text-main); border: 1px solid var(--border-light); outline: none; }
    .find-count { min-width: 50px; color: #888; }
    mark.find { background: rgba(255, 212, 59, .75); color: inherit; }
    mark.find.cur { background: rgba(255, 146, 43, .9); }
    .doc-pdf mark.find { background: #ffd43b; }
    .doc-pdf mark.find.cur { background: #ff922b; }
    .doc-imgwrap { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .doc-imgwrap img { display: block; width: 100%; height: auto; }
    .ann-rect {
      position: absolute; z-index: 3; box-sizing: border-box; border: 2px solid #f08c00;
      background: rgba(255, 224, 102, .25); cursor: pointer;
    }
    .ann-rect[data-color="g"] { border-color: #2f9e44; background: rgba(140, 233, 154, .25); }
    .ann-rect[data-color="b"] { border-color: #1971c2; background: rgba(116, 192, 252, .25); }
    .ann-rect[data-color="p"] { border-color: #c2255c; background: rgba(250, 162, 193, .25); }
    .ann-rect.drawing { pointer-events: none; border-style: dashed; }
    .ann-rect.has-note { box-shadow: 0 0 0 2px rgba(232, 89, 12, .5); }
    .ann-rect.flash { outline: 3px solid #e8590c; }
    .rect-mode .doc-body { cursor: crosshair; }
    .rect-mode .textLayer, .rect-mode .ann-rect { pointer-events: none; }
    .doc-actions button, .doc-actions input { font-family: 'Noto Sans KR', sans-serif; }
    .ann-count {
      background: transparent; color: var(--text-main); border: 1px solid var(--border-light);
      padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    }
    .ann-count[hidden], .ann-list[hidden] { display: none; }
    .ann-count:hover { background: var(--gutter-bg); }
    .ann-list {
      position: absolute; top: 34px; right: 12px; z-index: 20; width: 300px; max-width: calc(100% - 24px);
      max-height: 55%; overflow-y: auto; background: #2a2a2a; color: #ddd;
      border: 1px solid #444; box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: 12px;
    }
    .ann-item { display: flex; gap: 8px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #383838; }
    .ann-item:hover { background: #333; }
    .ann-chip { width: 10px; height: 10px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
    .ann-item-quote { color: #ccc; }
    .ann-item-note { color: #f0b86e; margin-top: 3px; white-space: pre-wrap; }
    .ann-empty { padding: 14px; text-align: center; color: #888; line-height: 1.6; }
    .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-close {
      background: #333; color: #fff; border: none;
      padding: 4px 12px; font-size: 12px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0;
    }
    .doc-close:hover { background: #000; }
    .doc-body { flex: 1; overflow: auto; padding: 16px; }
    .doc-msg { color: #888; font-size: 13px; padding: 20px; text-align: center; }
    .pdf-page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .pdf-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
    /* pdf.js 텍스트 레이어: 투명 글자를 캔버스 위에 겹쳐 드래그/복사/하이라이트를 가능하게 함 */
    .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; }
    .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: rgba(0, 90, 255, .3); }
    mark.ann { background: rgba(255, 224, 102, .6); color: inherit; border-radius: 2px; cursor: pointer; }
    mark.ann[data-color="g"] { background: rgba(140, 233, 154, .6); }
    mark.ann[data-color="b"] { background: rgba(116, 192, 252, .55); }
    mark.ann[data-color="p"] { background: rgba(250, 162, 193, .6); }
    /* PDF: 하이라이트는 canvas 아래에 깔리고 canvas가 multiply로 겹쳐져 글자가 선명하게 유지된다 */
    .pdf-page { isolation: isolate; }
    .doc-pdf mark.ann { background: #ffe066; }
    .doc-pdf mark.ann[data-color="g"] { background: #8ce99a; }
    .doc-pdf mark.ann[data-color="b"] { background: #74c0fc; }
    .doc-pdf mark.ann[data-color="p"] { background: #faa2c1; }
    mark.ann.has-note { border-bottom: 2px solid #e8590c; }
    mark.ann.flash { outline: 3px solid #e8590c; }
    #ann-pop {
      position: fixed; z-index: 10000; display: none; background: #2a2a2a; color: #eee; padding: 6px;
      border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.45); font-size: 12px; max-width: 260px;
    }
    #ann-pop .ann-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; margin: 0 3px 0 0; vertical-align: middle; }
    #ann-pop .ann-dot.cur { border-color: #fff; }
    #ann-pop .ann-btn { background: #3a3a3a; color: #eee; border: none; padding: 4px 8px; margin-left: 4px; cursor: pointer; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; vertical-align: middle; }
    #ann-pop .ann-btn:hover { background: #4a4a4a; }
    #ann-pop .ann-note { display: block; width: 240px; margin-top: 6px; background: #1f1f1f; color: #eee; border: 1px solid #555; padding: 6px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; resize: vertical; outline: none; }
    #ann-pop .ann-quote { margin-top: 4px; color: #999; font-size: 11px; }
    .doc-page {
      background: #fff; color: #222;
      max-width: 820px; margin: 0 auto; padding: 32px 36px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      font-family: 'Noto Serif KR', serif; font-size: 15px; line-height: 1.8;
      word-break: break-word; overflow-x: auto;
    }
    .doc-page p { min-height: 1.2em; margin: 0 0 .3em; }
    .doc-page img { max-width: 100%; height: auto; }
    .doc-page table { border-collapse: collapse; margin: 8px 0; max-width: 100%; }
    .doc-page.hwpx { font-size: 10pt; line-height: 1.6; }
    .doc-page.hwpx p { margin: 0; }
    .doc-page .hwpx-noimg { color: #999; font-size: .85em; }
    .doc-page td, .doc-page th { border: 1px solid #999; padding: 4px 8px; vertical-align: top; }
    .doc-page h1, .doc-page h2, .doc-page h3 { margin: .8em 0 .4em; }
    .doc-page ul, .doc-page ol { margin: .4em 0 .4em 1.6em; }

    /* ── 모바일 최적화 ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      #sidebar {
        width: 100%;
        min-width: 0;
        height: auto;
        max-height: 40vh;
        flex-direction: column;
        border-bottom: 2px solid #000;
      }

      /* 햄버거 토글 버튼 (사이드바 접기) */
      #sidebar.collapsed {
        max-height: 46px;
        overflow: hidden;
      }

      #sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        cursor: pointer;
      }

      #mobile-toggle-icon {
        font-size: 14px;
        transition: transform 0.2s;
      }
      #sidebar.collapsed #mobile-toggle-icon {
        transform: rotate(-90deg);
      }

      #new-btn, #split-toggle, #theme-toggle, #logout-btn {
        margin: 6px 10px;
        padding: 10px 0;
        font-size: 13px;
      }

      #memo-list {
        max-height: 30vh;
      }

      .memo-item {
        padding: 12px 14px;
        font-size: 14px;
      }

      #panels { flex-direction: column; }

      .panel-header {
        padding: 10px 12px 8px;
      }
      .panel-title-input { font-size: 16px; }
      .save-btn { padding: 8px 14px; font-size: 13px; }

      .memo-editor { padding: 14px 16px; font-size: 15px; }

      .gutter { width: 22px; min-width: 22px; }
      .pin-dot { width: 9px; height: 9px; }

      /* 분할 모드는 모바일에서 세로로 전환 */
      .panel + .panel { border-left: none; border-top: 3px solid #bbb; }
      .divider { display: none !important; }
    }
  </style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="lock-screen" style="
  position: fixed; inset: 0;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 16px;
">
  <div style="color: #777; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-family: 'Noto Sans KR', sans-serif;">MEMOS</div>
  <input id="email-input" type="email" placeholder="이메일" autocomplete="username" style="
    background: #2a2a2a;
    border: 1px solid #444;
    color: #eee;
    padding: 10px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    width: 220px;
    text-align: center;
  " />
  <input id="pw-input" type="password" placeholder="비밀번호" autocomplete="current-password" style="
    background: #2a2a2a;
    border: 1px solid #444;
    color: #eee;
    padding: 10px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    width: 220px;
    text-align: center;
  " />
  <div id="pw-error" style="color: #e03131; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; height: 16px;"></div>
</div>

<div id="sidebar">
  <div id="sidebar-header">MEMOS <span id="mobile-toggle-icon">▾</span></div>
  <button id="new-btn">+ 새 메모</button>
  <button id="split-toggle">⊟ 분할화면</button>
  <button id="theme-toggle">🌙 다크모드</button>
  <button id="logout-btn" style="margin:0 10px 10px;background:#2a2a2a;color:#888;border:1px solid #3a3a3a;padding:6px 0;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;width:calc(100% - 20px);">로그아웃</button>
  <div id="memo-list"></div>
  <div id="doc-header">DOCS</div>
  <div id="doc-list"></div>
  <div id="usage"></div>
  <div id="status">🔒 로그인 필요</div>
</div>

<div id="panels"></div>

<script type="module">

  async function doLogin() {
    const email = emailInput.value.trim(), pw = pwInput.value;
    if (!email || !pw) return;
    pwError.textContent = "로그인 중...";
    try {

        ? "시도가 너무 많습니다. 잠시 후 다시 시도하세요."
        : "이메일 또는 비밀번호가 틀렸습니다.");
    }
  }

  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    themeToggle.textContent = dark ? "☀️ 라이트모드" : "🌙 다크모드";

  const db       = getDatabase(app);
  const memosRef = ref(db, "memos");
  const docsRef  = ref(db, "docs");
  const storage  = getStorage(app);

  const panelsEl    = document.getElementById("panels");
  const memoListEl  = document.getElementById("memo-list");
  const statusEl    = document.getElementById("status");
  const newBtn      = document.getElementById("new-btn");
  const splitToggle = document.getElementById("split-toggle");
  const docListEl   = document.getElementById("doc-list");
  const usageEl     = document.getElementById("usage");

  let memos   = {};
  let docs    = {};          // RTDB에 저장된 문서 메타 { id: {name, path, size} }
  const localDocs = {};      // 업로드 실패 시 이번 세션에서만 볼 수 있는 임시 문서
  const docCache  = new Map(); // id -> ArrayBuffer (재다운로드 방지)
  const getDoc = (id) => docs[id] || localDocs[id];
  let splitOn = false;
  let pins    = {};  // { memoId: Set<paraIdx> }
  let panels  = [];

  function getPins(id) {
    if (!pins[id]) pins[id] = new Set();
    return pins[id];
  }

  function textToHtml(text) {
    if (!text) return "<p><br></p>";
    return text.split("\n").map(l => `<p>${l ? esc(l) : "<br>"}</p>`).join("");
  }
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function htmlToText(el) {
    return Array.from(el.querySelectorAll("p")).map(p =>
      (p.innerHTML === "<br>" || p.innerHTML === "") ? "" : p.innerText
    ).join("\n");
  }

  // ── 거터 렌더링 ──
  // 각 <p>의 offsetTop, offsetHeight를 그대로 반영해서 정확히 맞춤
  function renderGutter(panelIdx) {
    const p = panels[panelIdx];
    if (!p || !p.gutterEl || !p.editorEl) return;

    const pinSet    = p.memoId ? getPins(p.memoId) : new Set();
    const paras     = p.editorEl.querySelectorAll("p");
    const inner     = p.gutterEl.querySelector(".gutter-inner");
    if (!inner) return;
    inner.innerHTML = "";

    // 에디터 padding-top (18px)
    const editorPaddingTop = parseFloat(getComputedStyle(p.editorEl).paddingTop) || 0;

    paras.forEach((para, i) => {
      const row = document.createElement("div");
      row.className = "gutter-row";
      // <p>의 에디터 내 위치와 높이를 그대로 사용
      row.style.position = "absolute";
      row.style.top      = (para.offsetTop + editorPaddingTop - editorPaddingTop) + "px";
      row.style.height   = para.offsetHeight + "px";
      row.style.width    = "100%";

      const dot = document.createElement("div");
      dot.className = "pin-dot" + (pinSet.has(i) ? " on" : "");

      row.addEventListener("click", () => {
        pinSet.has(i) ? pinSet.delete(i) : pinSet.add(i);
        dot.classList.toggle("on");
      });

      row.appendChild(dot);
      inner.appendChild(row);
    });

    // inner 높이를 에디터 scrollHeight에 맞춤
    inner.style.height = p.editorEl.scrollHeight + "px";
  }

  // ── 패널 DOM 생성 ──
  function createPanelEl(panelIdx) {
    const wrap = document.createElement("div");
    wrap.className = "panel";

    wrap.innerHTML = `
      <div class="panel-header">
        <input class="panel-title-input" type="text" placeholder="제목 없음" maxlength="80" />
        <button class="doc-btn" title="PDF / DOCX / HWPX / 이미지 열기">📄 문서</button>
        <input class="doc-file" type="file" accept=".pdf,.docx,.hwpx,.png,.jpg,.jpeg,.gif,.webp,.bmp" hidden />
        <button class="save-btn">저장</button>
      </div>
      <div class="doc-view">
        <div class="doc-bar">
          <span class="doc-name"></span>
          <span class="doc-actions">
            <span class="pdf-nav" hidden>
              <button class="pg-prev" title="이전 쪽">‹</button><input class="pg-input" type="number" min="1" value="1"><span class="pg-slash">/</span><span class="pg-total">1</span><button class="pg-next" title="다음 쪽">›</button>
            </span>
            <span class="zoom-ctl" hidden>
              <button class="zoom-out" title="축소">−</button><span class="zoom-val">100%</span><button class="zoom-in" title="확대">＋</button><button class="zoom-fit" title="폭에 맞춤">맞춤</button>
            </span>
            <button class="find-btn" hidden title="문서에서 찾기 (Ctrl+F)">🔍</button>
            <button class="rect-btn" hidden title="영역 표시: 드래그로 사각형 그리기">▭</button>
            <button class="ann-count" hidden title="하이라이트/메모 목록">💬 0</button>
            <button class="doc-close">✕ 닫고 메모로</button>
          </span>
        </div>
        <div class="find-bar" hidden>
          <input class="find-input" type="text" placeholder="문서에서 찾기" />
          <span class="find-count"></span>
          <button class="find-prev" title="이전 (Shift+Enter)">▲</button><button class="find-next" title="다음 (Enter)">▼</button><button class="find-close" title="닫기 (Esc)">✕</button>
        </div>
        <div class="ann-list" hidden></div>
        <div class="doc-body"></div>

        <div class="gutter"><div class="gutter-inner"></div></div>

    const titleInput = wrap.querySelector(".panel-title-input");

    const selcount   = wrap.querySelector(".selcount");

    // 문서 열기: 버튼 / 드래그앤드롭

    const docInput = wrap.querySelector(".doc-file");

    docInput.addEventListener("change", () => {

    wrap.querySelector(".doc-close").addEventListener("click", () => closeDoc(panelIdx));
    const annList = wrap.querySelector(".ann-list");
    wrap.querySelector(".ann-count").addEventListener("click", () => { annList.hidden = !annList.hidden; });
    const docBody = wrap.querySelector(".doc-body");
    docBody.addEventListener("mouseup", (e) => onDocPointerUp(panelIdx, e));
    docBody.addEventListener("touchend", (e) => onDocPointerUp(panelIdx, e));
    docBody.addEventListener("scroll", () => {
      hideAnnPop();
      if (pState.docKind === "pdf" && pState.docReady) requestAnimationFrame(() => updateCurrentPage(pState));
      saveDocPosSoon(pState);
    });
    docBody.addEventListener("mousedown", (e) => startRect(panelIdx, e));
    wrap.addEventListener("mousedown", () => { lastDocPanel = panelIdx; }, true);

    // 도구 모음
    const q = (sel) => wrap.querySelector(sel);
    q(".pg-prev").addEventListener("click", () => jumpPage(pState, currentPage(pState) - 1));
    q(".pg-next").addEventListener("click", () => jumpPage(pState, currentPage(pState) + 1));
    q(".pg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { jumpPage(pState, parseInt(e.target.value, 10) || 1); e.target.blur(); } });
    q(".zoom-in").addEventListener("click", () => stepZoom(pState, 1));
    q(".zoom-out").addEventListener("click", () => stepZoom(pState, -1));
    q(".zoom-fit").addEventListener("click", () => setZoom(pState, 1));
    q(".rect-btn").addEventListener("click", () => setRectMode(pState, !pState.rectMode));
    q(".find-btn").addEventListener("click", () => openFind(pState));
    q(".find-close").addEventListener("click", () => closeFind(pState));
    q(".find-next").addEventListener("click", () => findStep(pState, 1));
    q(".find-prev").addEventListener("click", () => findStep(pState, -1));
    let findTimer = null;
    q(".find-input").addEventListener("input", (e) => {

      findTimer = setTimeout(() => runFind(pState, e.target.value), 200);

    wrap.addEventListener("dragover", (e) => {

    saveBtn.addEventListener("click", () => savePanel(panelIdx));

    titleInput.addEventListener("input", () => { pState.dirty = true; });

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {

        document.execCommand("insertParagraph");
        requestAnimationFrame(() => renderGutter(panelIdx));

    editor.addEventListener("input", () => {

    // 스크롤 동기화: gutter-inner를 translateY로 에디터 스크롤에 맞춤
    editor.addEventListener("scroll", () => {
      const inner = gutter.querySelector(".gutter-inner");
      if (inner) inner.style.transform = `translateY(-${editor.scrollTop}px)`;
    });

    // 붙여넣기 시 서식 제거 → 순수 텍스트만
    editor.addEventListener("paste", (e) => {
      e.preventDefault();
      // 메모장(Windows) 등에서 복사한 텍스트는 줄바꿈이 \r\n으로 되어 있어
      // \r과 \n이 각각 개행으로 처리되면서 엔터가 중복되는 문제가 있어 정규화한다.
      const text = e.clipboardData.getData("text/plain").replace(/\r\n?/g, "\n");
      document.execCommand("insertText", false, text);
      requestAnimationFrame(() => renderGutter(panelIdx));
    });

    const ro = new ResizeObserver(() => requestAnimationFrame(() => renderGutter(panelIdx)));
    ro.observe(editor);

    return wrap;

  // ── 문서 뷰어 (PDF / DOCX / HWPX) ──
  // 라이브러리는 문서를 처음 열 때 한 번만 지연 로드한다.
  const libCache = {};
  function loadScript(src) {
    if (!libCache[src]) {
      libCache[src] = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => { delete libCache[src]; reject(new Error("라이브러리 로드 실패: " + src)); };
        document.head.appendChild(s);
      });
    }
    return libCache[src];
  }
  const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
  const PDFJS_BASE = CDN + "pdf.js/3.11.174/";

  // PDF: canvas(그림) + pdf.js 텍스트 레이어(드래그/복사/주석용 투명 텍스트)
  // PDF: 텍스트 레이어는 전 페이지를 만들고(드래그/검색/주석용), canvas는 화면 근처 페이지만 그린다(메모리 절약)
  async function renderPdf(buf, body, p) {
    await loadScript(PDFJS_BASE + "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
    const seq = p ? ++p.pdfSeq : 0;
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    if (p && seq !== p.pdfSeq) return;
    const wrap = document.createElement("div");
    wrap.className = "doc-pdf doc-textroot";
    body.innerHTML = "";
    body.appendChild(wrap);
    const zoom = (p && p.zoom) || 1;
    const cssW = Math.max((body.clientWidth - 32) * zoom, 200);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const io = new IntersectionObserver((entries) => {
      for (const en of entries) en.isIntersecting ? drawPdfPage(en.target) : releasePdfPage(en.target);
    }, { root: body, rootMargin: "1200px 0px" });
    if (p) { p.pdfIOs.forEach(o => o.disconnect()); p.pdfIOs = [io]; p.pdfPages = pdf.numPages; }
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      if (p && seq !== p.pdfSeq) return;
      const scale = cssW / page.getViewport({ scale: 1 }).width;
      const vpCss = page.getViewport({ scale });
      const pageEl = document.createElement("div");
      pageEl.className = "pdf-page ann-page";
      pageEl.style.width = vpCss.width + "px";
      pageEl.style.height = vpCss.height + "px";
      pageEl._page = page; pageEl._scale = scale; pageEl._dpr = dpr;
      const textDiv = document.createElement("div");
      textDiv.className = "textLayer";
      textDiv.style.setProperty("--scale-factor", vpCss.scale);
      pageEl.appendChild(textDiv);
      wrap.appendChild(pageEl);
      io.observe(pageEl);
      await pdfjsLib.renderTextLayer({
        textContentSource: await page.getTextContent(),
        container: textDiv,
        viewport: vpCss,
        textDivs: []
      }).promise;
    }
  }
  async function drawPdfPage(pageEl) {
    if (pageEl._canvas) return;
    const canvas = document.createElement("canvas");
    pageEl._canvas = canvas;
    const vp = pageEl._page.getViewport({ scale: pageEl._scale * pageEl._dpr });
    canvas.width = vp.width;
    canvas.height = vp.height;
    pageEl.appendChild(canvas);  // 텍스트 레이어 뒤(위)에 얹힘 → multiply로 하이라이트와 겹침
    try {
      pageEl._task = pageEl._page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
      await pageEl._task.promise;
    } catch (e) { /* 렌더링 취소됨 */ }
  }
  function releasePdfPage(pageEl) {
    if (!pageEl._canvas) return;
    try { pageEl._task && pageEl._task.cancel(); } catch (e) {}
    pageEl._canvas.remove();
    pageEl._canvas = null;
  }

  const IMAGE_MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", bmp: "image/bmp" };
  async function renderImage(buf, body, p, ext) {
    const url = URL.createObjectURL(new Blob([buf], { type: IMAGE_MIME[ext] }));
    if (p) { if (p.objUrl) URL.revokeObjectURL(p.objUrl); p.objUrl = url; }
    body.innerHTML = '<div class="doc-imgwrap ann-page"><img alt=""></div>';
    body.firstChild.style.width = (((p && p.zoom) || 1) * 100) + "%";
    const img = body.querySelector("img");
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("이미지를 해석할 수 없습니다.")); img.src = url; });
  }

  async function renderDocx(buf, body) {
    await loadScript(CDN + "mammoth/1.6.0/mammoth.browser.min.js");
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    body.innerHTML = '<div class="doc-page doc-textroot"></div>';
    body.firstChild.innerHTML = result.value || '<p class="doc-msg">내용이 없습니다.</p>';
  }

  // HWPX = ZIP + XML. 본문(문단/표/그림)과 header.xml의 글자·문단·테두리 서식을 읽어 HTML로 변환한다.
  // 1hwpunit = 1/7200인치 → 96dpi 기준 75hwpunit = 1px
  async function renderHwpx(buf, body) {
    await loadScript(CDN + "jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(buf);
    const parseXml = async (name) => {
      const f = zip.file(name);
      if (!f) return null;
      const x = new DOMParser().parseFromString(await f.async("string"), "application/xml");
      return x.querySelector("parsererror") ? null : x;
    };
    const kids = (el, name) => Array.from(el.children).filter(c => c.localName === name);
    const px = (v) => (parseInt(v, 10) || 0) / 75;

    const names = Object.keys(zip.files)
      .filter(n => /^Contents\/section\d+\.xml$/i.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10));
    if (!names.length) throw new Error("HWPX 본문(section)을 찾을 수 없습니다.");

    // ── header.xml: 글자/문단/테두리 서식 ──
    const charPr = {}, paraAlign = {}, borderFill = {};
    const header = await parseXml("Contents/header.xml");
    if (header) {
      for (const el of header.getElementsByTagName("*")) {
        const ln = el.localName, id = el.getAttribute("id");
        if (ln === "charPr") {
          const css = [];
          const size = parseInt(el.getAttribute("height"), 10);
          if (size) css.push(`font-size:${size / 100}pt`);
          const color = el.getAttribute("textColor");
          if (color && /^#[0-9a-f]{6}$/i.test(color) && color !== "#000000") css.push(`color:${color}`);
          if (kids(el, "bold").length) css.push("font-weight:bold");
          if (kids(el, "italic").length) css.push("font-style:italic");
          const ul = kids(el, "underline")[0];
          if (ul && ul.getAttribute("type") && ul.getAttribute("type") !== "NONE") css.push("text-decoration:underline");
          charPr[id] = css.join(";");
        } else if (ln === "paraPr") {
          const al = kids(el, "align")[0];
          if (al) paraAlign[id] = { LEFT: "left", RIGHT: "right", CENTER: "center", JUSTIFY: "justify", DISTRIBUTE: "justify" }[al.getAttribute("horizontal")];
        } else if (ln === "borderFill") {
          const bf = {};
          for (const side of ["left", "right", "top", "bottom"]) {
            const b = kids(el, side + "Border")[0];
            if (!b) continue;
            const type = b.getAttribute("type");
            const mm = parseFloat(b.getAttribute("width")) || 0.12;
            const w = Math.min(3, Math.max(1, Math.round(mm * 3.78)));
            bf[side] = !type || type === "NONE" ? "none" : `${w}px ${type === "DASH" || type === "DOT" ? "dashed" : "solid"} ${b.getAttribute("color") || "#000"}`;
          }
          const brush = el.getElementsByTagName("*");
          for (const c of brush) {
            if (c.localName === "winBrush") {
              const fc = c.getAttribute("faceColor");
              if (fc && /^#[0-9a-f]{6}$/i.test(fc)) bf.bg = fc;
            }
          }
          borderFill[id] = bf;
        }
      }
    }

    // ── 본문 XML 로드 + 그림 파일 미리 읽기 ──
    const sections = [];
    for (const name of names) {
      const xml = await parseXml(name);
      if (!xml) throw new Error("HWPX XML 해석 실패");
      sections.push(xml);
    }
    const manifest = {};
    const hpf = await parseXml("Contents/content.hpf");
    if (hpf) for (const it of hpf.getElementsByTagName("*")) {
      if (it.localName === "item" && it.getAttribute("id") && it.getAttribute("href")) manifest[it.getAttribute("id")] = it.getAttribute("href");
    }
    const MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", bmp: "image/bmp", webp: "image/webp", svg: "image/svg+xml" };
    const findBin = (refId) => {
      const href = manifest[refId];
      for (const cand of [href, href && "Contents/" + href]) if (cand && zip.file(cand)) return cand;
      return Object.keys(zip.files).find(n => /^BinData\//i.test(n) && n.replace(/^.*\//, "").replace(/\.[^.]+$/, "") === refId) || null;
    };
    const imgUrls = {};
    const refs = new Set();
    for (const xml of sections) for (const el of xml.getElementsByTagName("*")) {
      if (el.localName === "img" && el.getAttribute("binaryItemIDRef")) refs.add(el.getAttribute("binaryItemIDRef"));
    }
    await Promise.all([...refs].map(async (refId) => {
      const path = findBin(refId);
      const mime = path && MIME[path.split(".").pop().toLowerCase()];
      if (path && mime) imgUrls[refId] = `data:${mime};base64,` + await zip.file(path).async("base64");
    }));

    const page = document.createElement("div");
    page.className = "doc-page doc-textroot hwpx";

    function buildPic(pic) {
      const imgEl = Array.from(pic.getElementsByTagName("*")).find(e => e.localName === "img");
      const url = imgEl && imgUrls[imgEl.getAttribute("binaryItemIDRef")];
      if (!url) {
        const ph = document.createElement("span");
        ph.className = "hwpx-noimg";
        ph.textContent = "[그림]";
        return ph;
      }
      const img = document.createElement("img");
      img.src = url;
      const sz = kids(pic, "curSz")[0] || kids(pic, "sz")[0];
      if (sz && px(sz.getAttribute("width")) > 0) img.style.width = px(sz.getAttribute("width")) + "px";
      img.style.maxWidth = "100%";
      img.style.height = "auto";
      return img;
    }

    function walkP(pEl, out) {
      const al = paraAlign[pEl.getAttribute("paraPrIDRef")];
      const newP = () => { const e = document.createElement("p"); if (al) e.style.textAlign = al; return e; };
      let p = newP();
      out.appendChild(p);
      const addText = (txt, style) => {
        if (!txt) return;
        if (style) { const sp = document.createElement("span"); sp.style.cssText = style; sp.textContent = txt; p.appendChild(sp); }
        else p.appendChild(document.createTextNode(txt));
      };
      (function rec(n, style) {
        for (const c of n.children) {
          const ln = c.localName;
          if (ln === "run") rec(c, charPr[c.getAttribute("charPrIDRef")] || style);
          else if (ln === "t") {
            for (const node of c.childNodes) {
              if (node.nodeType === 3) addText(node.nodeValue, style);
              else if (node.localName === "tab") addText(" ", style);
              else if (node.localName === "lineBreak") p.appendChild(document.createElement("br"));
              else if (node.localName === "nbSpace" || node.localName === "fwSpace") addText(" ", style);
              else addText(node.textContent, style);
            }
          }
          else if (ln === "tbl") { out.appendChild(buildTbl(c)); p = newP(); out.appendChild(p); }
          else if (ln === "pic") p.appendChild(buildPic(c));
          else if (ln === "lineBreak") p.appendChild(document.createElement("br"));
          else if (ln === "header" || ln === "footer") continue;
          else rec(c, style);
        }
      })(pEl, "");
    }

    function buildTbl(tbl) {
      const table = document.createElement("table");
      const tsz = kids(tbl, "sz")[0];
      if (tsz && px(tsz.getAttribute("width")) > 0) table.style.width = px(tsz.getAttribute("width")) + "px";
      const tblBf = borderFill[tbl.getAttribute("borderFillIDRef")];
      for (const tr of kids(tbl, "tr")) {
        const row = table.insertRow();
        for (const tc of kids(tr, "tc")) {
          const td = row.insertCell();
          const span = kids(tc, "cellSpan")[0];
          if (span) {
            const cs = parseInt(span.getAttribute("colSpan"), 10), rs = parseInt(span.getAttribute("rowSpan"), 10);
            if (cs > 1) td.colSpan = cs;
            if (rs > 1) td.rowSpan = rs;
          }
          const csz = kids(tc, "cellSz")[0];
          if (csz) {
            if (px(csz.getAttribute("width")) > 0) td.style.width = px(csz.getAttribute("width")) + "px";
            if (px(csz.getAttribute("height")) > 0) td.style.height = px(csz.getAttribute("height")) + "px";
          }
          // 셀 테두리/배경: header의 borderFill. 정보가 없으면 기본 실선.
          const bf = borderFill[tc.getAttribute("borderFillIDRef")] || tblBf;
          if (bf) {
            td.style.border = "none";
            for (const side of ["left", "right", "top", "bottom"]) if (bf[side]) td.style["border" + side[0].toUpperCase() + side.slice(1)] = bf[side];
            if (bf.bg) td.style.background = bf.bg;
          }
          const sub = kids(tc, "subList")[0];
          if (sub) {
            const va = { TOP: "top", CENTER: "middle", BOTTOM: "bottom" }[sub.getAttribute("vertAlign")];
            if (va) td.style.verticalAlign = va;
            kids(sub, "p").forEach(p => walkP(p, td));
          }
        }
      }
      return table;
    }

    for (const xml of sections) kids(xml.documentElement, "p").forEach(p => walkP(p, page));
    body.innerHTML = "";
    body.appendChild(page);
  }

  let synced = false;

  // ── 사용량 표시 (무료 한도: 저장 5GB / 일 다운로드 1GB) ──
  const LIMIT_DOWN = 1 * 1024 ** 3;   // 하루 다운로드
  const LIMIT_STORE = 5 * 1024 ** 3;  // 총 저장
  let usageToday = 0;                 // 오늘 이 앱이 내려받은 바이트
  let usageDay = null, usageUnsub = null;
  // Storage 일일 할당량은 태평양시 자정 기준으로 초기화된다.
  const dayKey = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
  const fmtBytes = (n) => n >= 1024 ** 3 ? (n / 1024 ** 3).toFixed(2) + "GB"
                        : n >= 1024 ** 2 ? (n / 1024 ** 2).toFixed(1) + "MB"
                        : Math.ceil(n / 1024) + "KB";

  function renderUsage() {
    const stored = Object.values(docs).reduce((a, d) => a + (d.size || 0), 0);
    const row = (label, used, limit) => {
      const pct = Math.min(used / limit * 100, 100);
      const cls = used >= limit ? "over" : used >= limit * 0.8 ? "warn" : "";
      return `<div class="u-row"><span>${label}</span><span>${fmtBytes(used)} / ${fmtBytes(limit)}</span></div>
              <div class="u-bar"><div class="u-fill ${cls}" style="width:${pct}%"></div></div>`;
    };
    usageEl.innerHTML = row("오늘 다운로드", usageToday, LIMIT_DOWN) + row("저장 용량", stored, LIMIT_STORE);
  }
  function subscribeUsage() {
    const day = dayKey();
    if (day === usageDay) return;
    if (usageUnsub) usageUnsub();
    usageDay = day;
    usageToday = 0;
    usageUnsub = onValue(ref(db, `usage/${day}`), (snap) => {
      usageToday = (snap.val() && snap.val().down) || 0;
      renderUsage();
    });
    renderUsage();
  }
  setInterval(() => { if (synced) subscribeUsage(); }, 60000);  // 날짜가 바뀌면 새 날짜로 전환
  function addDownloadUsage(bytes) {
    usageToday += bytes;
    renderUsage();
    update(ref(db, `usage/${dayKey()}`), { down: increment(bytes) }).catch(() => {});
  }

  // 한 번 받은 문서는 브라우저 Cache API에 보관해 새로고침 때 재다운로드(=한도 소모)를 막는다.
  async function cacheGet(id) {
    try { const r = await (await caches.open("docs-v1")).match("/__doc/" + id); return r ? await r.arrayBuffer() : null; }
    catch (e) { return null; }
  }
  async function cachePut(id, buf) {
    try { await (await caches.open("docs-v1")).put("/__doc/" + id, new Response(buf.slice(0))); } catch (e) {}
  }
  async function cacheDelete(id) {
    try { await (await caches.open("docs-v1")).delete("/__doc/" + id); } catch (e) {}
  }
  async function loadDocBuffer(id, d) {
    let buf = docCache.get(id) || await cacheGet(id);
    if (!buf) {
      if (usageToday + (d.size || 0) > LIMIT_DOWN &&
          !confirm(`오늘 다운로드가 무료 한도(1GB)를 넘을 수 있습니다. (현재 ${fmtBytes(usageToday)})\n그래도 불러올까요?`))
        throw new Error("다운로드 한도 확인에서 취소됨");
      buf = await getBytes(sRef(storage, d.path));
      addDownloadUsage(buf.byteLength);
      cachePut(id, buf);
    }
    docCache.set(id, buf);
    return buf;
  }

  const DOC_RENDERERS = { pdf: renderPdf, docx: renderDocx, hwpx: renderHwpx };
  for (const ext of Object.keys(IMAGE_MIME)) DOC_RENDERERS[ext] = renderImage;
  const extOf = (name) => (name.split(".").pop() || "").toLowerCase();

  // 어떤 패널에 어떤 문서가 열려 있는지 기억 → 새로고침 후 복원
  function saveDocState() {
    try {
      localStorage.setItem("panelDocs", JSON.stringify({
        split: splitOn,
        ids: [panels[0] && panels[0].docId || null, panels[1] && panels[1].docId || null],
        memoIds: [panels[0] && panels[0].memoId || null, panels[1] && panels[1].memoId || null]
      }));
    } catch (e) {}
  }

  // 로컬 파일 선택/드롭 → Storage 업로드 → 패널에 표시
  async function openLocalFile(panelIdx, file) {
    const ext = extOf(file.name);
    if (!DOC_RENDERERS[ext]) {
      alert(ext === "hwp" || ext === "doc"
        ? `.${ext} (구형 바이너리 포맷)은 지원하지 않습니다. ${ext === "hwp" ? "한글에서 .hwpx" : "Word에서 .docx"}로 저장 후 열어주세요.`
        : "PDF, DOCX, HWPX, 이미지(PNG/JPG/GIF/WEBP/BMP) 파일만 열 수 있습니다.");
      return;
    }
    const buf = await file.arrayBuffer();
    const path = `docs/${Date.now()}_${file.name.replace(/[^\w.\-가-힣]+/g, "_")}`;
    try {
      const task = uploadBytesResumable(sRef(storage, path), buf, { contentType: file.type || undefined });
      task.on("state_changed", (snap) => {
        statusEl.textContent = `⬆️ 업로드 ${Math.round(snap.bytesTransferred / snap.totalBytes * 100)}% · ${file.name}`;
      });
      await task;
      const newRef = push(docsRef);
      await set(newRef, { name: file.name, path, size: file.size, ts: Date.now() });
      docCache.set(newRef.key, buf);
      cachePut(newRef.key, buf);
      docs[newRef.key] = { name: file.name, path, size: file.size };  // onValue 도착 전에도 바로 열 수 있게
      statusEl.textContent = "✅ 문서 저장됨 " + new Date().toLocaleTimeString();
      openDoc(panelIdx, newRef.key);
    } catch (e) {
      statusEl.textContent = "❌ 업로드 실패(이번 세션에서만 보임): " + e.message;
      const tmpId = "local_" + Date.now();
      localDocs[tmpId] = { name: file.name, local: true };
      docCache.set(tmpId, buf);
      openDoc(panelIdx, tmpId);
    }
  }

  // 문서 상태 정리 (다른 문서를 열거나 닫을 때)
  function cleanupDoc(p) {
    if (p.annUnsub) { p.annUnsub(); p.annUnsub = null; }
    if (p.docRO) { p.docRO.disconnect(); p.docRO = null; }
    clearTimeout(p.roTimer);
    clearTimeout(p.posTimer);
    p.pdfSeq++;
    p.pdfIOs.forEach(o => o.disconnect());
    p.pdfIOs = [];
    if (p.objUrl) { URL.revokeObjectURL(p.objUrl); p.objUrl = null; }
    saveNoteNow();
    hideAnnPop();
    setRectMode(p, false);
    closeFind(p);
    p.anns = {};
    p.annsLoaded = false;
    p.orphans = new Set();
    p.docReady = false;
    p.pendingEdit = null;
    p.pendingJump = null;
    p.docBuf = null;
    renderAnnList(p);
    updateDocTools(p);
  }

  // PDF는 패널 폭이 바뀌면(분할 드래그 등) 폭에 맞춰 다시 그린다.
  // 폭/배율이 바뀌면 PDF를 다시 그린다 (스크롤 비율 유지)
  async function rerenderPdf(p) {
    const body = p.panelEl.querySelector(".doc-body");
    const token = p.docToken;
    const ratio = body.scrollTop / (body.scrollHeight || 1);
    await DOC_RENDERERS[p.docExt](p.docBuf.slice(0), body, p, p.docExt);
    if (token !== p.docToken || !p.docReady) return;
    body.scrollTop = ratio * body.scrollHeight;
    applyAnns(p);
    updateDocTools(p);
  }

  // PDF는 패널 폭이 바뀌면(분할 드래그 등) 폭에 맞춰 다시 그린다.
  function watchPdfResize(p, token) {
    const body = p.panelEl.querySelector(".doc-body");
    let lastW = body.clientWidth;
    p.docRO = new ResizeObserver(() => {
      clearTimeout(p.roTimer);
      p.roTimer = setTimeout(() => {
        const w = body.clientWidth;
        if (token !== p.docToken || !p.docReady || w === 0 || Math.abs(w - lastW) < 40) return;
        lastW = w;
        rerenderPdf(p);
      }, 400);
    });
    p.docRO.observe(body);
  }

  async function openDoc(panelIdx, docId) {
    const p = panels[panelIdx];
    const d = getDoc(docId);
    if (!p || !d) return;
    const ext = extOf(d.name);
    const renderer = DOC_RENDERERS[ext];
    if (!renderer) return;
    cleanupDoc(p);
    const token = ++p.docToken;
    p.docId = docId;
    p.docExt = ext;
    p.docKind = ext === "pdf" ? "pdf" : IMAGE_MIME[ext] ? "image" : "text";
    const pos = loadDocPos(docId);
    p.zoom = (pos && pos.z) || 1;
    p.panelEl.classList.add("doc-open");
    p.panelEl.querySelector(".doc-name").textContent = "📄 " + d.name;
    const body = p.panelEl.querySelector(".doc-body");
    body.innerHTML = '<div class="doc-msg">⏳ 문서를 불러오는 중...</div>';
    saveDocState();
    renderDocList();
    renderAnnList(p);
    try {
      const buf = await loadDocBuffer(docId, d);
      if (token !== p.docToken) return;  // 그 사이 다른 문서를 열었거나 닫힘
      p.docBuf = buf;
      await renderer(buf.slice(0), body, p, ext);
      if (token !== p.docToken) return;
      p.docReady = true;
      updateDocTools(p);
      if (p.docKind === "pdf") watchPdfResize(p, token);
      // 하이라이트/메모는 업로드된 문서에만 저장된다(임시 문서 제외)
      if (!d.local) {
        p.annUnsub = onValue(ref(db, `annotations/${docId}`), (snap) => {
          p.anns = snap.val() || {};
          p.annsLoaded = true;
          if (p.docReady) applyAnns(p);
          renderAnnList(p);
        }, () => {});
      } else p.annsLoaded = true;
      // 읽던 위치 복원 (바로 이동할 대상이 있으면 그쪽 우선)
      if (pos && !p.pendingJump) requestAnimationFrame(() => { body.scrollTop = pos.r * body.scrollHeight; p.posReady = true; });
      else p.posReady = true;
      processPendingJump(p);
    } catch (e) {
      if (token !== p.docToken) return;
      body.innerHTML = "";
      const msg = document.createElement("div");
      msg.className = "doc-msg";
      msg.textContent = "❌ 문서를 열 수 없습니다: " + e.message;
      body.appendChild(msg);
    }
  }

  function closeDoc(panelIdx) {
    const p = panels[panelIdx];
    if (!p) return;
    p.docToken++;
    cleanupDoc(p);
    p.docId = null;
    p.panelEl.classList.remove("doc-open");
    p.panelEl.querySelector(".doc-body").innerHTML = "";
    saveDocState();
    renderDocList();
    requestAnimationFrame(() => renderGutter(panelIdx));
  }

  // 읽던 위치(스크롤 비율, 배율)를 문서별로 이 브라우저에 기억
  function loadDocPos(id) {
    try { return (JSON.parse(localStorage.getItem("docPos")) || {})[id] || null; } catch (e) { return null; }
  }
  function saveDocPos(id, pos) {
    try {
      const all = JSON.parse(localStorage.getItem("docPos")) || {};
      all[id] = { ...pos, t: Date.now() };
      const keys = Object.keys(all);
      if (keys.length > 100) keys.sort((a, b) => all[a].t - all[b].t).slice(0, keys.length - 100).forEach(k => delete all[k]);
      localStorage.setItem("docPos", JSON.stringify(all));
    } catch (e) {}
  }
  function saveDocPosSoon(p) {
    clearTimeout(p.posTimer);
    p.posTimer = setTimeout(() => {
      if (!p.docId || !p.docReady || !p.posReady) return;
      const body = p.panelEl.querySelector(".doc-body");
      saveDocPos(p.docId, { r: body.scrollTop / (body.scrollHeight || 1), z: p.zoom });
    }, 500);
  }

  // 특정 위치로 문서 열기: jump = { ann: id } | { page: n } | { find: "검색어", page?: n }
  function openDocAt(panelIdx, docId, jump) {
    const p = panels[panelIdx];
    if (p && p.docId === docId && p.docReady) { p.pendingJump = jump; processPendingJump(p); return; }
    openDoc(panelIdx, docId);
    if (panels[panelIdx]) panels[panelIdx].pendingJump = jump;  // openDoc의 동기 구간(cleanup) 이후에 지정
  }
  function processPendingJump(p) {
    const j = p.pendingJump;
    if (!j || !p.docReady) return;
    const body = p.panelEl.querySelector(".doc-body");
    if (j.ann) {
      if (jumpToAnn(p, j.ann)) p.pendingJump = null;
      else if (p.annsLoaded) { p.pendingJump = null; statusEl.textContent = "⚠️ 문서에서 해당 위치를 찾을 수 없습니다."; }
      return;
    }
    p.pendingJump = null;
    p.posReady = true;
    if (j.page) jumpPage(p, j.page);
    if (j.find) { openFind(p, j.find); }
  }

  // DOCS 클릭: 문서를 메모 위가 아니라 오른쪽 패널에 띄운다 (왼쪽=메모, 오른쪽=문서)
  function sidebarClickDoc(docId) {
    if (!splitOn) setSplit(true);
    openDoc(1, docId);
  }

  // ── 하이라이트 / 메모(주석) ──
  // 주석 위치는 문서 텍스트 전체(.doc-textroot의 텍스트 노드 이어붙인 문자열)에서의 글자 오프셋으로 저장하고,
  // 렌더링 후 <mark>로 다시 입힌다. 문서가 바뀌어 오프셋이 어긋나면 저장해 둔 인용문(quote)으로 위치를 다시 찾는다.
  const ANN_COLORS = { y: "#ffe066", g: "#8ce99a", b: "#74c0fc", p: "#faa2c1" };
  const annPop = document.createElement("div");
  annPop.id = "ann-pop";
  document.body.appendChild(annPop);
  let annPopState = null;   // { p, mode: "create" | "edit", sel?, annId? }
  let noteTimer = null;

  const annPath = (p) => `annotations/${p.docId}`;
  const textRootOf = (p) => p.panelEl.querySelector(".doc-textroot");
  const trunc = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;

  function textNodesOf(root) {
    const out = [];
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) out.push(w.currentNode);
    return out;
  }

  function wrapRange(root, s, e, a, cls = "ann") {
    let pos = 0;
    const todo = [];
    for (const n of textNodesOf(root)) {
      const ns = pos, ne = pos + n.nodeValue.length;
      pos = ne;
      if (ne <= s) continue;
      if (ns >= e) break;
      todo.push({ n, from: Math.max(s, ns) - ns, to: Math.min(e, ne) - ns });
    }
    for (const t of todo) {
      let node = t.n;
      if (t.from > 0) node = node.splitText(t.from);
      if (t.to - t.from < node.nodeValue.length) node.splitText(t.to - t.from);
      const m = document.createElement("mark");
      m.className = cls + (a.note ? " has-note" : "");
      m.dataset.id = a.id;
      m.dataset.color = a.color || "y";
      if (a.note) m.title = a.note;
      node.parentNode.insertBefore(m, node);
      m.appendChild(node);
    }
  }

  function applyAnns(p) {
    const body = p.panelEl.querySelector(".doc-body");
    body.querySelectorAll(".ann-rect").forEach(r => r.remove());
    const root = textRootOf(p);
    const list = Object.entries(p.anns || {}).map(([id, a]) => ({ id, ...a }));
    p.orphans = new Set();
    if (root) {
      root.querySelectorAll("mark.ann").forEach(m => m.replaceWith(...m.childNodes));
      root.normalize();
      const full = textNodesOf(root).map(n => n.nodeValue).join("");
      for (const a of list.filter(a => a.type !== "rect").sort((x, y) => x.start - y.start)) {
        let s = a.start, e = a.end;
        if (full.slice(s, e) !== a.quote) {
          const i = a.quote ? full.indexOf(a.quote) : -1;
          if (i < 0) { p.orphans.add(a.id); continue; }
          s = i; e = i + a.quote.length;
        }
        wrapRange(root, s, e, a);
      }
    }
    // 영역(사각형) 표시: 페이지 크기에 대한 비율로 저장돼 있어 확대/축소해도 맞는다
    const pages = body.querySelectorAll(".ann-page");
    for (const a of list.filter(a => a.type === "rect")) {
      const pg = pages[a.page - 1];
      if (!pg) { p.orphans.add(a.id); continue; }
      const r = document.createElement("div");
      r.className = "ann-rect" + (a.note ? " has-note" : "");
      r.dataset.id = a.id;
      r.dataset.color = a.color || "y";
      r.style.cssText = `left:${a.x * 100}%;top:${a.y * 100}%;width:${a.w * 100}%;height:${a.h * 100}%`;
      if (a.note) r.title = a.note;
      pg.appendChild(r);
    }
    renderAnnList(p);
    if (p.pendingEdit) {
      const m = body.querySelector(`mark.ann[data-id="${p.pendingEdit}"], .ann-rect[data-id="${p.pendingEdit}"]`);
      if (m) {
        p.pendingEdit = null;
        showEditPop(p, m.dataset.id, m.getBoundingClientRect());
        const ta = annPop.querySelector(".ann-note");
        if (ta) ta.focus();
      }
    }
    processPendingJump(p);
  }

  function jumpToAnn(p, id) {
    const el = p.panelEl.querySelector(`mark.ann[data-id="${id}"], .ann-rect[data-id="${id}"]`);
    if (!el) return false;
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1500);
    return true;
  }

  function currentSelection(p) {
    const root = textRootOf(p);
    const sel = window.getSelection();
    if (!root || !sel.rangeCount || sel.isCollapsed) return null;
    const r = sel.getRangeAt(0);
    if (!root.contains(r.commonAncestorContainer)) return null;
    const pre = document.createRange();
    pre.selectNodeContents(root);
    pre.setEnd(r.startContainer, r.startOffset);
    let quote = r.toString();
    const start = pre.toString().length + (quote.length - quote.trimStart().length);
    quote = quote.trim();
    if (!quote || quote.length > 5000) return null;
    return { start, end: start + quote.length, quote };
  }

  function colorDots(current) {
    return Object.entries(ANN_COLORS).map(([k, c]) =>
      `<button class="ann-dot${k === current ? " cur" : ""}" data-color="${k}" style="background:${c}" title="하이라이트"></button>`).join("");
  }

  function placePop(rect) {
    annPop.style.display = "block";
    const w = annPop.offsetWidth, h = annPop.offsetHeight;
    const left = Math.min(Math.max(rect.left, 8), Math.max(8, window.innerWidth - w - 8));
    let top = rect.bottom + 8;
    if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 8);
    annPop.style.left = left + "px";
    annPop.style.top = top + "px";
  }

  function showCreatePop(p, sel, rect) {
    annPopState = { p, mode: "create", sel };
    annPop.innerHTML = colorDots("") + '<button class="ann-btn" data-act="note">💬 메모</button>';
    placePop(rect);
  }

  function showEditPop(p, annId, rect) {
    const a = p.anns[annId];
    if (!a) return;
    saveNoteNow();
    annPopState = { p, mode: "edit", annId };
    annPop.innerHTML = colorDots(a.color) + '<button class="ann-btn danger" data-act="del" title="삭제">🗑</button>' +
      '<textarea class="ann-note" rows="3" placeholder="메모를 입력하세요..."></textarea><div class="ann-quote"></div>';
    annPop.querySelector(".ann-note").value = a.note || "";
    annPop.querySelector(".ann-quote").textContent = a.type === "rect" ? `▭ 영역 (${a.page}쪽)` : "“" + trunc(a.quote, 80) + "”";
    placePop(rect);
  }

  function hideAnnPop() {
    saveNoteNow();
    annPop.style.display = "none";
    annPopState = null;
  }

  function saveNoteNow() {
    clearTimeout(noteTimer);
    const st = annPopState;
    if (!st || st.mode !== "edit") return;
    const ta = annPop.querySelector(".ann-note");
    const a = st.p.anns && st.p.anns[st.annId];
    if (!ta || !a || (a.note || "") === ta.value) return;
    update(ref(db, `${annPath(st.p)}/${st.annId}`), { note: ta.value }).catch((e) => { statusEl.textContent = "❌ " + e.message; });
  }

  function createAnn(p, sel, color, openEdit) {
    const r = push(ref(db, annPath(p)));
    if (openEdit) p.pendingEdit = r.key;
    window.getSelection().removeAllRanges();
    hideAnnPop();
    set(r, { start: sel.start, end: sel.end, quote: sel.quote, color, note: "", ts: Date.now() })
      .catch((e) => { statusEl.textContent = "❌ " + e.message; });
  }

  annPop.addEventListener("mousedown", (e) => {
    if (e.target.tagName !== "TEXTAREA") e.preventDefault();  // 선택 영역/포커스 유지
  });
  annPop.addEventListener("click", (e) => {
    const st = annPopState;
    if (!st) return;
    const dot = e.target.closest(".ann-dot"), btn = e.target.closest(".ann-btn");
    if (dot) {
      if (st.mode === "create") createAnn(st.p, st.sel, dot.dataset.color, false);
      else update(ref(db, `${annPath(st.p)}/${st.annId}`), { color: dot.dataset.color });
    } else if (btn && btn.dataset.act === "note" && st.mode === "create") {
      createAnn(st.p, st.sel, "y", true);
    } else if (btn && btn.dataset.act === "del" && st.mode === "edit") {
      const { p, annId } = st;
      hideAnnPop();
      remove(ref(db, `${annPath(p)}/${annId}`));
    }
  });
  annPop.addEventListener("input", (e) => {
    if (!e.target.classList.contains("ann-note")) return;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNoteNow, 600);
  });
  document.addEventListener("mousedown", (e) => { if (!annPop.contains(e.target)) hideAnnPop(); });

  // 문서 본문에서 드래그/클릭이 끝났을 때: 선택이 있으면 하이라이트 팝업, 기존 하이라이트를 눌렀으면 편집 팝업
  function onDocPointerUp(panelIdx, e) {
    setTimeout(() => {
      const p = panels[panelIdx];
      const d = p && p.docId && getDoc(p.docId);
      if (!p || !p.docReady || !d || d.local) return;
      const sel = currentSelection(p);
      if (sel) {
        showCreatePop(p, sel, window.getSelection().getRangeAt(0).getBoundingClientRect());
        return;
      }
      const mark = e.target.closest && e.target.closest("mark.ann, .ann-rect");
      if (mark && !p.rectMode) showEditPop(p, mark.dataset.id, mark.getBoundingClientRect());
    }, 0);
  }

  // ── 문서 도구 모음: 쪽 이동, 확대/축소, 문서 내 검색, 영역 표시 ──
  const ZOOM_STEPS = [0.5, 0.75, 1, 1.25, 1.5, 2, 3];
  function updateDocTools(p) {
    const q = (sel) => p.panelEl.querySelector(sel);
    const d = p.docId && getDoc(p.docId);
    const ready = !!(d && p.docReady);
    q(".pdf-nav").hidden = !(ready && p.docKind === "pdf");
    q(".zoom-ctl").hidden = !(ready && p.docKind !== "text");
    q(".find-btn").hidden = !(ready && textRootOf(p));
    q(".rect-btn").hidden = !(ready && !d.local && p.docKind !== "text");
    q(".zoom-val").textContent = Math.round((p.zoom || 1) * 100) + "%";
    if (ready && p.docKind === "pdf") {
      q(".pg-total").textContent = p.pdfPages || 1;
      q(".pg-input").max = p.pdfPages || 1;
      updateCurrentPage(p);
    }
  }
  function currentPage(p) {
    const body = p.panelEl.querySelector(".doc-body");
    const top = body.getBoundingClientRect().top;
    let cur = 1;
    const line = Math.max(80, body.clientHeight * 0.3);  // 화면 위쪽 30% 지점에 걸친 쪽을 현재 쪽으로
    body.querySelectorAll(".pdf-page").forEach((pg, i) => { if (pg.getBoundingClientRect().top - top <= line) cur = i + 1; });
    return cur;
  }
  function updateCurrentPage(p) {
    const inp = p.panelEl.querySelector(".pg-input");
    if (document.activeElement !== inp) inp.value = currentPage(p);
  }
  function jumpPage(p, n) {
    const body = p.panelEl.querySelector(".doc-body");
    const pg = body.querySelectorAll(".pdf-page")[Math.min(Math.max(n, 1), p.pdfPages || 1) - 1];
    if (pg) body.scrollTop += pg.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
  }
  function stepZoom(p, dir) {
    let i = ZOOM_STEPS.findIndex(z => z >= (p.zoom || 1) - 1e-6);
    if (i < 0) i = ZOOM_STEPS.length - 1;
    const next = ZOOM_STEPS[Math.min(Math.max(i + dir, 0), ZOOM_STEPS.length - 1)];
    setZoom(p, next);
  }
  function setZoom(p, z) {
    if (!p.docReady || z === p.zoom) return;
    p.zoom = z;
    updateDocTools(p);
    saveDocPosSoon(p);
    rerenderPdf(p);   // PDF/이미지 모두 같은 경로로 다시 그림
  }

  function setRectMode(p, on) {
    p.rectMode = on;
    p.panelEl.classList.toggle("rect-mode", on);
    const btn = p.panelEl.querySelector(".rect-btn");
    if (btn) btn.classList.toggle("on", on);
  }
  function createRectAnn(p, r) {
    const ref0 = push(ref(db, annPath(p)));
    p.pendingEdit = ref0.key;
    set(ref0, { type: "rect", ...r, color: "y", note: "", quote: "", ts: Date.now() })
      .catch((e) => { statusEl.textContent = "❌ " + e.message; });
  }
  function startRect(panelIdx, e) {
    const p = panels[panelIdx];
    if (!p || !p.rectMode || e.button !== 0) return;
    const pageEl = e.target.closest(".ann-page");
    if (!pageEl) return;
    e.preventDefault();
    const r0 = pageEl.getBoundingClientRect();
    const x0 = Math.min(Math.max(e.clientX, r0.left), r0.right), y0 = Math.min(Math.max(e.clientY, r0.top), r0.bottom);
    const box = document.createElement("div");
    box.className = "ann-rect drawing";
    pageEl.appendChild(box);
    let rr = null;
    const move = (ev) => {
      const x = Math.min(Math.max(ev.clientX, r0.left), r0.right), y = Math.min(Math.max(ev.clientY, r0.top), r0.bottom);
      rr = { l: Math.min(x, x0) - r0.left, t: Math.min(y, y0) - r0.top, w: Math.abs(x - x0), h: Math.abs(y - y0) };
      box.style.cssText = `left:${rr.l}px;top:${rr.t}px;width:${rr.w}px;height:${rr.h}px`;
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      box.remove();
      setRectMode(p, false);  // 한 번 그리면 자동 종료
      if (!rr || rr.w < 8 || rr.h < 8) return;
      const page = Array.from(p.panelEl.querySelectorAll(".ann-page")).indexOf(pageEl) + 1;
      createRectAnn(p, { page, x: rr.l / r0.width, y: rr.t / r0.height, w: rr.w / r0.width, h: rr.h / r0.height });
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  }

  // 문서 내 검색 (Ctrl+F)
  function clearFind(p) {
    const root = textRootOf(p);
    if (root) {
      root.querySelectorAll("mark.find").forEach(m => m.replaceWith(...m.childNodes));
      root.normalize();
    }
    p.find = { q: "", n: 0, cur: -1 };
    const c = p.panelEl.querySelector(".find-count");
    if (c) c.textContent = "";
  }
  function closeFind(p) {
    clearFind(p);
    const bar = p.panelEl.querySelector(".find-bar");
    if (bar) bar.hidden = true;
  }
  function runFind(p, q) {
    clearFind(p);
    const root = textRootOf(p);
    if (!q || !root) return;
    const low = textNodesOf(root).map(n => n.nodeValue).join("").toLowerCase(), lq = q.toLowerCase();
    const hits = [];
    for (let i = low.indexOf(lq); i >= 0 && hits.length < 500; i = low.indexOf(lq, i + lq.length)) hits.push(i);
    hits.forEach((st, k) => wrapRange(root, st, st + q.length, { id: "f" + k }, "find"));
    p.find = { q, n: hits.length, cur: -1 };
    findStep(p, 1);
  }
  function findStep(p, dir) {
    const f = p.find, root = textRootOf(p);
    const c = p.panelEl.querySelector(".find-count");
    if (!f || !f.n) { if (c) c.textContent = f && f.q ? "결과 없음" : ""; return; }
    f.cur = (f.cur + dir + f.n) % f.n;
    root.querySelectorAll("mark.find.cur").forEach(m => m.classList.remove("cur"));
    const ms = root.querySelectorAll(`mark.find[data-id="f${f.cur}"]`);
    ms.forEach(m => m.classList.add("cur"));
    if (ms[0]) ms[0].scrollIntoView({ block: "center" });
    c.textContent = `${f.cur + 1}/${f.n}`;
  }
  function openFind(p, q) {
    const bar = p.panelEl.querySelector(".find-bar");
    const inp = bar.querySelector(".find-input");
    bar.hidden = false;
    if (q !== undefined) inp.value = q;
    inp.focus();
    inp.select();
    if (inp.value) runFind(p, inp.value);
  }
  let lastDocPanel = 0;
  const activeDocPanel = () => {
    const ok = (p) => p && p.docId && p.docReady;
    return ok(panels[lastDocPanel]) ? panels[lastDocPanel] : panels.find(ok) || null;
  };

  // 상단 "💬 N" 버튼: 이 문서의 하이라이트/메모 목록
  function renderAnnList(p) {
    const btn = p.panelEl.querySelector(".ann-count");
    const list = p.panelEl.querySelector(".ann-list");
    const d = p.docId && getDoc(p.docId);
    const key = (a) => a.type === "rect" ? 1e12 + (a.page || 0) : a.start;
    const ids = Object.keys(p.anns || {}).sort((x, y) => key(p.anns[x]) - key(p.anns[y]));
    btn.hidden = !d || d.local;
    btn.textContent = "💬 " + ids.length;
    list.innerHTML = "";
    if (!ids.length) {
      list.innerHTML = '<div class="ann-empty">텍스트를 드래그해서<br>하이라이트나 메모를 추가하세요</div>';
      return;
    }
    ids.forEach(id => {
      const a = p.anns[id];
      const item = document.createElement("div");
      item.className = "ann-item";
      const chip = document.createElement("span");
      chip.className = "ann-chip";
      chip.style.background = ANN_COLORS[a.color] || ANN_COLORS.y;
      const txt = document.createElement("div");
      txt.className = "ann-item-text";
      const q = document.createElement("div");
      q.className = "ann-item-quote";
      q.textContent = (a.type === "rect" ? `▭ ${a.page}쪽 영역` : trunc(a.quote, 60)) + (p.orphans && p.orphans.has(id) ? "  (위치를 찾을 수 없음)" : "");
      txt.appendChild(q);
      if (a.note) {
        const n = document.createElement("div");
        n.className = "ann-item-note";
        n.textContent = trunc(a.note, 120);
        txt.appendChild(n);
      }
      item.append(chip, txt);
      item.addEventListener("click", () => {
        list.hidden = true;
        if (!jumpToAnn(p, id)) statusEl.textContent = "⚠️ 문서에서 해당 위치를 찾을 수 없습니다.";
      });
      list.appendChild(item);
    });
  }

  async function deleteDoc(id) {
    const d = getDoc(id);
    if (!d || !confirm(`"${d.name}" 문서를 삭제할까요?`)) return;
    panels.forEach((p, i) => { if (p && p.docId === id) closeDoc(i); });
    docCache.delete(id);
    cacheDelete(id);
    if (d.local) { delete localDocs[id]; renderDocList(); return; }
    try { await deleteObject(sRef(storage, d.path)); } catch (e) {}
    remove(ref(db, `annotations/${id}`));
    remove(ref(db, `docs/${id}`));
  }

  function renderDocList() {
    docListEl.innerHTML = "";
    const all = { ...docs, ...localDocs };
    const ids = Object.keys(all);
    if (!ids.length) {
      docListEl.innerHTML = '<div style="padding:10px 14px;color:#555;font-size:11px;">문서 없음</div>';
      return;
    }
    const open = panels.map(p => p && p.docId);
    ids.forEach(id => {
      const item = document.createElement("div");
      item.className = "memo-item doc-item" + (open.includes(id) ? " active" : "");
      const t = document.createElement("span");
      t.className = "memo-item-title";
      t.textContent = (all[id].local ? "⚠️ " : "📄 ") + all[id].name;
      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "×";
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteDoc(id); });
      item.appendChild(t);
      item.appendChild(del);
      item.addEventListener("click", () => sidebarClickDoc(id));
      docListEl.appendChild(item);
    });
  }

  function loadMemoInPanel(panelIdx, memoId) {
    const p = panels[panelIdx];
    if (!p) return;
    if (p.docId) closeDoc(panelIdx);
    p.memoId = memoId;
    const m = memos[memoId] || {};
    p.titleEl.value      = m.title   || "";
    p.editorEl.innerHTML = textToHtml(m.content || "");
    p.editorEl.setAttribute("data-placeholder", "여기에 메모를 입력하세요...");
    p.dirty = false;
    const panelEl = panelsEl.children[splitOn ? panelIdx * 2 : 0];
    const charcountEl = panelEl ? panelEl.querySelector(".charcount") : null;
    if (charcountEl) charcountEl.textContent = htmlToText(p.editorEl).length + "자";
    // pins 로드
    const savedPins = m.pins ? new Set(m.pins) : new Set();
    pins[memoId] = savedPins;
    requestAnimationFrame(() => renderGutter(panelIdx));
    renderList();
    saveDocState();
  }

  function savePanel(panelIdx, isAuto = false) {
    const p = panels[panelIdx];
    if (!p || !p.memoId) return;
    const panelEl = panelsEl.children[splitOn ? panelIdx * 2 : 0];
    const saveBtn = panelEl ? panelEl.querySelector(".save-btn") : null;
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "저장 중..."; }
    const title   = p.titleEl.value.trim() || "제목 없음";
    const content = htmlToText(p.editorEl);
    const pinArr  = p.memoId && pins[p.memoId] ? Array.from(pins[p.memoId]) : [];
    set(ref(db, `memos/${p.memoId}`), { title, content, pins: pinArr })
      .then(() => {
        p.dirty = false;
        statusEl.textContent = (isAuto ? "💾 자동저장 " : "✅ ") + new Date().toLocaleTimeString();
        if (saveBtn) { saveBtn.textContent = "저장"; saveBtn.disabled = false; }
      })
      .catch((e) => {
        statusEl.textContent = "❌ " + e.message;
        if (saveBtn) { saveBtn.textContent = "저장"; saveBtn.disabled = false; }
      });
  }

  // ── 1분마다 자동저장 (변경된 패널만) ──
  setInterval(() => {
    panels.forEach((p, i) => {
      if (p && p.memoId && p.dirty) savePanel(i, true);
    });
  }, 60000);

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      panels.forEach((p, i) => {
        if (p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl))
          savePanel(i);
      });
      const anyFocused = panels.some(p => p && (document.activeElement === p.editorEl || document.activeElement === p.titleEl));
      if (!anyFocused && panels[0] && panels[0].memoId) savePanel(0);
    }

    // Ctrl(Cmd) + F: 열려 있는 문서 안에서 검색 (문서가 없으면 브라우저 기본 검색)
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "f") {
      const dp = activeDocPanel();
      if (dp && textRootOf(dp)) { e.preventDefault(); openFind(dp); }
    }

    // Ctrl(Cmd) + Alt + C: 포커스된 에디터 글꼴 Consolas 전환/해제
    if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === "c") {
      e.preventDefault();
      let target = panels.find(p => p && document.activeElement === p.editorEl);
      if (!target) target = panels[0];
      if (target && target.editorEl) target.editorEl.classList.toggle("font-consolas");
    }
  });

  // ── 드래그 선택된 글자수 표시 ──
  function updateSelectionCounts() {
    const sel = (window.getSelection && window.getSelection()) || null;
    panels.forEach((p) => {
      if (!p || !p.selCountEl) return;
      let len = 0;
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const range = sel.getRangeAt(0);
        if (p.editorEl.contains(range.commonAncestorContainer)) {
          len = sel.toString().length;
        }
      }
      p.selCountEl.textContent = len > 0 ? `선택 ${len}자 · ` : "";
    });
  }
  document.addEventListener("selectionchange", updateSelectionCounts);

  function setSplit(on) {
    splitOn = on;
    splitToggle.textContent = splitOn ? "⊞ 분할화면 ON" : "⊟ 분할화면";
    splitToggle.classList.toggle("on", splitOn);
    rebuildPanels();
    saveDocState();
  }
  splitToggle.addEventListener("click", () => setSplit(!splitOn));

  function rebuildPanels() {
    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    const doc0 = panels[0] ? panels[0].docId : null;
    const doc1 = panels[1] ? panels[1].docId : null;
    panels = [];
    panelsEl.innerHTML = "";

    const p0El = createPanelEl(0);
    panelsEl.appendChild(p0El);

    if (splitOn) {
      const div = document.createElement("div");
      div.className = "divider";
      panelsEl.appendChild(div);

      const p1El = createPanelEl(1);
      panelsEl.appendChild(p1El);

      let dragging = false;
      div.addEventListener("mousedown", (e) => { dragging = true; div.classList.add("dragging"); e.preventDefault(); });
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const rect = panelsEl.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.min(Math.max(pct, 20), 80);
        p0El.style.flex = "none";
        p0El.style.width = pct + "%";
        p1El.style.flex = "1";
      });
      document.addEventListener("mouseup", () => { dragging = false; div.classList.remove("dragging"); });

      if (id1) loadMemoInPanel(1, id1);
    }

    if (id0) loadMemoInPanel(0, id0);
    if (doc0) openDoc(0, doc0);
    if (splitOn && doc1) openDoc(1, doc1);
    renderList();
  }

  function sidebarClickMemo(memoId) {
    if (!splitOn) {
      loadMemoInPanel(0, memoId);
    } else if (panels[1] && panels[1].docId) {
      loadMemoInPanel(0, memoId);  // 오른쪽은 문서 뷰어 → 메모는 왼쪽에
    } else {
      if (panels[0] && panels[0].memoId === memoId) loadMemoInPanel(1, memoId);
      else loadMemoInPanel(0, memoId);
    }
  }

  function renderList() {
    memoListEl.innerHTML = "";
    const ids = Object.keys(memos);
    if (ids.length === 0) {
      memoListEl.innerHTML = '<div style="padding:10px 14px;color:#555;font-size:11px;">메모 없음</div>';
      return;
    }
    const id0 = panels[0] ? panels[0].memoId : null;
    const id1 = panels[1] ? panels[1].memoId : null;
    ids.forEach(id => {
      const m = memos[id];
      const item = document.createElement("div");
      const inMain = id === id0, inSub = id === id1;
      item.className = "memo-item" + (inMain && inSub ? " active-both" : inMain ? " active-main" : inSub ? " active-sub" : "");
      const titleSpan = document.createElement("span");
      titleSpan.className = "memo-item-title";
      titleSpan.textContent = m.title || "제목 없음";
      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "×";
      delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteMemo(id); });
      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      item.addEventListener("click", () => sidebarClickMemo(id));
      memoListEl.appendChild(item);
    });
  }

  newBtn.addEventListener("click", () => {
    const newRef = push(memosRef);
    set(newRef, { title: "새 메모", content: "" }).then(() => loadMemoInPanel(0, newRef.key));
  });

  function deleteMemo(id) {
    if (!confirm("이 메모를 삭제할까요?")) return;
    remove(ref(db, `memos/${id}`));
  }

  // 메모·문서 목록이 모두 도착하면 새로고침 전 상태(분할 여부, 각 패널의 메모/문서)를 한 번 복원한다.
  let memosReady = false, docsReady = false, restored = false;
  function tryRestore() {
    if (restored || !memosReady || !docsReady) return;
    restored = true;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("panelDocs")); } catch (e) {}
    if (!saved) return;
    if (saved.split && !splitOn) setSplit(true);
    (saved.memoIds || []).forEach((id, i) => {
      if (id && memos[id] && panels[i] && !panels[i].memoId) loadMemoInPanel(i, id);
    });
    (saved.ids || []).forEach((id, i) => {
      if (id && docs[id] && panels[i]) openDoc(i, id);
    });
  }

  const unsubs = [];
  function startSync() {
  unsubs.push(onValue(memosRef, (snapshot) => {
    memos = snapshot.val() || {};
    statusEl.textContent = "✅ 연결됨";
    // 열려있는 패널의 pins 갱신
    panels.forEach((p, i) => {
      if (p && p.memoId && memos[p.memoId]) {
        const m = memos[p.memoId];
        if (m.pins) pins[p.memoId] = new Set(m.pins);
      }
    });
    renderList();
    memosReady = true;
    tryRestore();
  }, (e) => { statusEl.textContent = "❌ " + e.message; memosReady = true; tryRestore(); }));
  }

  // ── 문서 목록 구독 ──
  function startDocSync() {
  unsubs.push(onValue(docsRef, (snapshot) => {
    docs = snapshot.val() || {};
    renderDocList();
    renderUsage();
    docsReady = true;
    tryRestore();
  }, (e) => { statusEl.textContent = "❌ " + e.message; docsReady = true; tryRestore(); }));
  }

  rebuildPanels();

  // ── 인증 상태에 따라 잠금/구독 ──
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    location.reload();  // 메모리의 데이터까지 깨끗이 비움
  });
  onAuthStateChanged(auth, (user) => {
    if (user) {
      lockScreen.style.display = "none";
      if (!synced) { synced = true; startSync(); startDocSync(); subscribeUsage(); }
    } else {
      lockScreen.style.display = "flex";
      statusEl.textContent = "🔒 로그인 필요";
      emailInput.focus();
    }
  });

</script>
</body>
</html>
